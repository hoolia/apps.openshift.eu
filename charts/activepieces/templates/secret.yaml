{{- if not .Values.secrets.existingSecret }}
{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "activepieces" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
{{- $given := dict "encryption-key" .Values.secrets.encryptionKey "jwt-secret" .Values.secrets.jwtSecret "queue-password" .Values.secrets.queuePassword }}
apiVersion: v1
kind: Secret
metadata:
  name: activepieces
  labels:
    app: activepieces
    app.kubernetes.io/name: activepieces
    app.kubernetes.io/component: credentials
    {{- include "activepieces.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $given }}
  {{- if $value }}
  {{ $key }}: {{ (eq $key "encryption-key" | ternary (include "activepieces.encryptionKey" $value) $value) | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else if eq $key "encryption-key" }}
  {{ $key }}: {{ randAlphaNum 32 | sha256sum | trunc 32 | b64enc | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: activepieces
  labels:
    app: activepieces
    app.kubernetes.io/name: activepieces
    app.kubernetes.io/component: credentials
    {{- include "activepieces.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: activepieces
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
{{- end }}
