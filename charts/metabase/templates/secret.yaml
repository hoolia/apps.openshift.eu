{{- if not .Values.secrets.existingSecret }}
{{- if eq .Values.secrets.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "metabase" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: metabase
  labels:
    app: metabase
    app.kubernetes.io/name: metabase
    app.kubernetes.io/component: credentials
    {{- include "metabase.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := dict "MB_ENCRYPTION_SECRET_KEY" .Values.secrets.encryptionKey "cookie-secret" .Values.secrets.cookieSecret }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase
  labels:
    app: metabase
    app.kubernetes.io/name: metabase
    app.kubernetes.io/component: credentials
    {{- include "metabase.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: metabase
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
{{- end }}
