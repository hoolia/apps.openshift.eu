{{- if .Values.dns.enabled }}
{{- $domain := .Values.upstream.domain }}
{{- $host := first .Values.upstream.hostnames }}
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: {{ include "mailu-wrapper.fullname" . }}
spec:
  endpoints:
  - dnsName: {{ $domain }}
    recordType: MX
    recordTTL: {{ .Values.dns.ttl }}
    targets:
    - {{ printf "%v %s" .Values.dns.mxPriority $host | quote }}
  - dnsName: {{ $domain }}
    recordType: TXT
    recordTTL: {{ .Values.dns.ttl }}
    targets:
    - {{ .Values.dns.spf | quote }}
  - dnsName: {{ printf "_dmarc.%s" $domain }}
    recordType: TXT
    recordTTL: {{ .Values.dns.ttl }}
    targets:
    - {{ .Values.dns.dmarc | quote }}
  {{- with .Values.dns.dkim.publicKey }}
  - dnsName: {{ printf "%s._domainkey.%s" $.Values.dns.dkim.selector $domain }}
    recordType: TXT
    recordTTL: {{ $.Values.dns.ttl }}
    targets:
    - {{ printf "v=DKIM1; k=rsa; p=%s" . | quote }}
  {{- end }}
{{- end }}
