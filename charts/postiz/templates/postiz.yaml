apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-uploads
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: storage
    {{- include "postiz.commonLabels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.uploads.size }}
  {{- if .Values.uploads.storageClassName }}
  storageClassName: {{ .Values.uploads.storageClassName }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: web
    {{- include "postiz.commonLabels" . | nindent 4 }}
  annotations:
    app.openshift.io/custom-icon: {{ .Chart.Icon }}
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"postiz-redis"},{"apiVersion":"apps/v1","kind":"Deployment","name":"postiz-temporal"},{"apiVersion":"postgresql.cnpg.io/v1","kind":"Cluster","name":"postiz-db"}]'
spec:
  replicas: 1
  # the uploads volume is ReadWriteOnce
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz
      annotations:
        checksum/proxy: {{ include (print $.Template.BasePath "/configmap-proxy.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "wrapper.podSecurity" . | nindent 8 }}
      initContainers:
      # brings the database schema to this version, as upstream's start script does; the
      # image has no schema engine: prisma runs from /tmp, outside the read-only /app, and
      # fetches its engine there
      - name: schema
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        workingDir: /tmp
        command:
        - npx
        - --yes
        - prisma@{{ .Values.prismaVersion }}
        - db
        - push
        - --skip-generate
        - --schema
        - /app/libraries/nestjs-libraries/src/database/prisma/schema.prisma
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        - name: npm_config_cache
          value: /tmp/.npm
        - name: npm_config_update_notifier
          value: "false"
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
      containers:
      - name: backend
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        workingDir: /app/apps/backend
        command: ["node", "--experimental-require-module", "./dist/apps/backend/src/main.js"]
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        - name: PORT
          value: "3000"
        {{- include "wrapper.providersEnvFrom" . | nindent 8 }}
        ports:
        - name: api
          containerPort: 3000
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /uploads
        startupProbe:
          tcpSocket:
            port: api
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: api
          periodSeconds: 10
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
      - name: frontend
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        workingDir: /app/apps/frontend
        command: ["/app/node_modules/.bin/next", "start", "-p", "4200", "-H", "127.0.0.1"]
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/apps/frontend/.next/cache
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
      - name: orchestrator
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        workingDir: /app/apps/orchestrator
        command: ["node", "--experimental-require-module", "./dist/apps/orchestrator/src/main.js"]
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        - name: ORCHESTRATOR_PORT
          value: "3002"
        {{- include "wrapper.providersEnvFrom" . | nindent 8 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /uploads
        readinessProbe:
          httpGet:
            path: /health/status
            port: 3002
          periodSeconds: 15
        resources:
          {{- toYaml .Values.orchestrator.resources | nindent 10 }}
      - name: proxy
        image: {{ .Values.proxy.image }}
        command: ["nginx", "-c", "/etc/postiz/nginx.conf", "-g", "daemon off;"]
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: proxy-tmp
          mountPath: /tmp
        - name: proxy-config
          mountPath: /etc/postiz
        - name: uploads
          mountPath: /uploads
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 6
        resources:
          {{- toYaml .Values.proxy.resources | nindent 10 }}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: proxy-tmp
        emptyDir: {}
      - name: next-cache
        emptyDir: {}
      - name: proxy-config
        configMap:
          name: postiz-proxy
      - name: uploads
        persistentVolumeClaim:
          claimName: postiz-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: postiz
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: web
    {{- include "postiz.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postiz
  ports:
  - name: http
    port: 8080
    targetPort: http
{{- if .Values.mcp.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-mcp
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: mcp
    {{- include "postiz.commonLabels" . | nindent 4 }}
  annotations:
    agentgateway.dev/mcp-path: /mcp
    agentgateway.dev/mcp-target-name: {{ .Values.mcp.targetName | default .Release.Name | quote }}
spec:
  selector:
    app.kubernetes.io/name: postiz
  ports:
  - name: mcp
    port: 3000
    targetPort: api
    {{- with .Values.mcp.appProtocol }}
    appProtocol: {{ . }}
    {{- end }}
{{- end }}
