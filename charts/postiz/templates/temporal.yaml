apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-temporal
  labels:
    app: postiz-temporal
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow
    {{- include "postiz.commonLabels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.temporal.size }}
  {{- if .Values.temporal.storageClassName }}
  storageClassName: {{ .Values.temporal.storageClassName }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-temporal
  labels:
    app: postiz-temporal
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow
    {{- include "postiz.commonLabels" . | nindent 4 }}
  annotations:
    app.openshift.io/custom-icon: https://avatars.githubusercontent.com/u/56493103
spec:
  replicas: 1
  # one SQLite file, written by one server
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz-temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz-temporal
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "wrapper.podSecurity" . | nindent 8 }}
      containers:
      - name: temporal
        image: {{ .Values.temporal.image }}
        args:
        - server
        - start-dev
        - --headless
        - --ip
        - 0.0.0.0
        - --port
        - "7233"
        - --db-filename
        - /data/temporal.db
        - --log-level
        - warn
        ports:
        - name: grpc
          containerPort: 7233
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: grpc
          periodSeconds: 10
        resources:
          {{- toYaml .Values.temporal.resources | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postiz-temporal
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-temporal
  labels:
    app: postiz-temporal
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: workflow
    {{- include "postiz.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postiz-temporal
  ports:
  - name: grpc
    port: 7233
    targetPort: grpc
    appProtocol: grpc
