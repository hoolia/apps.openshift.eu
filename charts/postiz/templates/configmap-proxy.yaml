apiVersion: v1
kind: ConfigMap
metadata:
  name: postiz-proxy
  labels:
    app: postiz
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: proxy
    {{- include "postiz.commonLabels" . | nindent 4 }}
data:
  # upstream's nginx.conf, unprivileged: port 8080, state under /tmp
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        access_log off;
        client_max_body_size 2G;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' '';
        }
        server {
            listen 8080;
            server_name _;
            gzip on;
            gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

            location /api/ {
                proxy_pass http://127.0.0.1:3000/;
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_read_timeout 600s;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Reload $http_reload;
                proxy_set_header Onboarding $http_onboarding;
                proxy_set_header Activate $http_activate;
                proxy_set_header Auth $http_auth;
                proxy_set_header Showorg $http_showorg;
                proxy_set_header Impersonate $http_impersonate;
                proxy_set_header Accept-Language $http_accept_language;
            }

            location /uploads/ {
                alias /uploads/;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
                types {
                    image/jpeg jpg jpeg;
                    image/png png;
                    image/gif gif;
                    image/webp webp;
                    image/avif avif;
                    image/bmp bmp;
                    image/tiff tif tiff;
                    video/mp4 mp4;
                }
                default_type application/octet-stream;
            }

            location / {
                proxy_pass http://127.0.0.1:4200/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Reload $http_reload;
                proxy_set_header Onboarding $http_onboarding;
                proxy_set_header Activate $http_activate;
                proxy_set_header Auth $http_auth;
                proxy_set_header Showorg $http_showorg;
                proxy_set_header Impersonate $http_impersonate;
                proxy_set_header Accept-Language $http_accept_language;
                proxy_set_header i18next $http_i18next;
            }
        }
    }
