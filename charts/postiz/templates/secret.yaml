{{- /* A value wins; else the value already in the cluster; else a new one. */}}
{{- $s := .Values.secrets }}
{{- $keys := list
  (dict "key" "jwt-secret" "value" $s.jwtSecret "length" 64)
  (dict "key" "redis-password" "value" $s.redisPassword "length" 32) }}
{{- if eq $s.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" .Release.Namespace "postiz-credentials" }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postiz-credentials
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: credentials
    {{- include "postiz.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- range $keys }}
  {{- if .value }}
  {{ .key }}: {{ .value | b64enc | quote }}
  {{- else if hasKey $existing .key }}
  {{ .key }}: {{ index $existing .key | quote }}
  {{- else }}
  {{ .key }}: {{ randAlphaNum (int .length) | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
{{- $es := $s.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-credentials
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: credentials
    {{- include "postiz.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: postiz-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $keys }}
  - secretKey: {{ .key }}
    remoteRef:
      key: {{ required (printf "secrets.externalSecret.items.%s is required" .key) (index $es.items .key) }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- if .Values.providers.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-providers
  labels:
    app: postiz
    app.kubernetes.io/name: postiz
    app.kubernetes.io/component: credentials
    {{- include "postiz.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $es.storeName }}
  target:
    name: postiz-providers
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $env, $ref := .Values.providers.externalSecret }}
  - secretKey: {{ $env }}
    remoteRef:
      key: {{ required (printf "providers.externalSecret.%s.key is required" $env) $ref.key }}
      property: {{ $ref.property | default "login.password" }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
{{- end }}
