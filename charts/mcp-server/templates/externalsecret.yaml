{{- $e := .Values.externalSecret }}
{{- if and .Values.image.repository $e.enabled }}
{{- $name := $e.name | default .Values.envFromSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "externalSecret.name or envFromSecret is required" $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    kind: {{ $e.storeKind }}
    name: {{ required "externalSecret.storeName is required" $e.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range required "externalSecret.data is required" $e.data }}
  - secretKey: {{ .secretKey }}
    remoteRef:
      key: {{ .item }}
      property: {{ .property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
