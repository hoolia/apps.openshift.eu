{{- if and .Values.image.repository .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
  annotations:
    # the server's state (logins, tokens) outlives an uninstall
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
