# Chatwoot web and worker image
image:
  repository: docker.io/chatwoot/chatwoot
  # empty: v<appVersion>-ce, the Community Edition build without the enterprise/ folder
  tag: ""
  pullPolicy: IfNotPresent

route:
  # empty: OpenShift assigns a host under the default application domain
  hostname: ""
  # labels of the Route, for example the label of a platform that registers an OIDC client
  # for the Route host
  labels: {}
  # annotations of the Route; the cert-manager ones issue its certificate
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt

# the Chatwoot account and its super admin, created on the first install
account:
  # name of the account
  name: Support
  # id of the account: 1 on a new database; a mismatch stops the install
  id: 1
  # email of the break-glass super admin, under the reserved domain .invalid, so that no
  # login at the OIDC provider can ever match it; empty: superadmin@chatwoot.invalid.
  # Its password is the key super-admin-password of Secret chatwoot-credentials
  adminEmail: ""

# The message signature of each staff member, set by the prepare Job for every staff user
# without one (a staff user appears at the first login and is signed at the next install or
# upgrade). A signature a user wrote or cleared in Chatwoot stays.
signature:
  # Markdown: **bold**, *italic*, [links](https://...), ![images](https://...), a backslash
  # at the end of a line for a line break. {name} becomes the staff member's display name,
  # else their name; a name that is an address becomes its local part (s.terburg: S. Terburg).
  # Empty: no signature is set
  text: ""
  # channel types where the reply editor adds the signature, unless the user switched it
  # off there: Channel::Api (the Odoo inboxes), Channel::Email, Channel::WebWidget
  channels:
    - Channel::Api

# the web server: dashboard, widget and API
web:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1536Mi

# the Sidekiq worker: mail, webhooks, notifications and other background jobs
worker:
  replicas: 1
  # jobs one worker runs at the same time
  concurrency: 10
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1536Mi

# the Job that migrates the database and sets up the account on every install and upgrade
prepare:
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 1536Mi

# further Chatwoot settings as environment variables, given to web, worker and the Job
extraEnv: []

# PostgreSQL cluster of the CloudNativePG operator
database:
  instances: 1
  size: 5Gi
  # empty: the default StorageClass of the cluster
  storageClassName: ""
  # a PostgreSQL image with pgvector, which Chatwoot requires: the standard images of
  # CloudNativePG carry it
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Valkey store of the job queue, the live updates and the one-time login tokens; kept on a
# volume, because a lost store loses the queued jobs
redis:
  image: docker.io/valkey/valkey:8.1.11-alpine
  size: 1Gi
  # empty: the default StorageClass of the cluster
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# where uploaded files and avatars are kept
attachments:
  # volume: a ReadWriteOnce volume that web and worker share, so both run on one node.
  # objectBucketClaim: a bucket of the storage class below; Chatwoot serves the files
  storage: volume
  volume:
    size: 10Gi
    # empty: the default StorageClass of the cluster
    storageClassName: ""
  objectBucketClaim:
    # storage class of the ObjectBucketClaim; required with storage objectBucketClaim
    storageClassName: ""
    # region given to the S3 client
    region: us-east-1
    # ConfigMap of the release namespace whose certificates the S3 client trusts, for an
    # endpoint signed by the cluster; empty: the system certificates only
    caConfigMap: openshift-service-ca.crt

# Staff log in at an OIDC provider through oauth2-proxy; a login bridge turns that login
# into a Chatwoot session, so nobody uses a Chatwoot password. Off: Chatwoot's own login
sso:
  enabled: false
  # OIDC issuer, for example https://login.example.com/realms/example
  issuerUrl: ""
  # empty: the Route host, for a provider whose client is named after the host
  clientId: ""
  scope: openid email profile
  # token claim that lists the groups of the user
  groupsClaim: groups
  # a user needs one of these groups; empty: every user of the issuer
  allowedGroups: []
  # members of these groups become administrators of the account, others agents; empty:
  # new users are agents and roles set in Chatwoot stay
  adminGroups: []
  emailDomains:
  - "*"
  # addresses that never log in, such as shared accounts of the issuer; exact address, any
  # case. A Chatwoot user the address already has stays: delete it first
  deniedEmails: []
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
  # how long access lasts after a user leaves the allowed groups
  session:
    # oauth2-proxy asks the OIDC provider again this often; a user no longer in an allowed
    # group is refused from then on
    refresh: 5m
    # an oauth2-proxy session ends after this, also without a refresh
    expire: 12h
    # a Chatwoot dashboard session ends after this many hours; the next one needs a login
    # at the OIDC provider. 25 to 720: the dashboard keeps its session cookie for whole
    # days rounded down, so below 25 the cookie expires at once and every login loops
    chatwootHours: 36
  # further oauth2-proxy flags
  extraArgs: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # paths of the host that website visitors reach without a login; everything else needs one
  public:
    # the live chat widget: its script, page, API, live updates and attachments
    widget: true
    # the public API of API channel inboxes, for a client app of your own
    inboxApi: false
    # satisfaction surveys sent to customers
    surveys: false
    # help center portals
    helpCenter: false
    # GET / of the host becomes a page for customers instead of the staff login: a
    # full-window chat of one Website inbox, a link to the customer portal and a staff
    # sign-in link to /app/login. https://<host>/#cw=<token>, with the cw_conversation
    # cookie of a site that embeds the widget, continues that conversation on the page.
    # Off: / is the staff login
    customerPage:
      enabled: false
      # name of the Website inbox the page chats in; while it does not exist, / stays the
      # staff login
      inbox: Website
      # title of the page
      title: Support
      # https address where customers find their orders, quotations and invoices, for
      # example a customer portal; empty: no link
      portalUrl: ""
      portalText: Orders, quotations and invoices
      # the customer login on the page, signed for the inbox's identity validation: an OIDC
      # public client with authorization code and PKCE whose redirect URI is
      # https://<host>/ and whose web origin is https://<host>. A visitor with a session at
      # the provider is logged in without a click, once per browser tab. Empty: no login
      login:
        issuerUrl: ""
        clientId: ""

# the login bridge next to oauth2-proxy, with sso.enabled
loginBridge:
  image: registry.access.redhat.com/ubi9/python-312-minimal:9.8-1793637445
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

networkPolicy:
  # NetworkPolicies that admit only what the components need between them
  enabled: true
  # further peers (NetworkPolicyPeer) that may reach Chatwoot web on port 3000, for
  # example an integration in another namespace
  webIngressFrom: []
  # peers (NetworkPolicyPeer) of the cluster DNS that the agent bridge asks
  dnsPeers:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openshift-dns
  # where the agent bridge may connect besides Chatwoot and DNS: the agent of agent.url and
  # its token endpoint. Name their addresses (ipBlock /32 peers) to keep the bridge from
  # every other endpoint. Empty: any public address, no private range, plus the namespace
  # of an agent.url that names a Service (<service>.<namespace>.svc) of this cluster
  agentEgress:
    to: []
    ports:
    - 443
  # where the agent bridge (with tenantFacts.enabled) and the MCP proxy (with mcp.enabled)
  # may reach the Kubernetes API: the endpoints of Service kubernetes in namespace default.
  # Empty: any address on these ports
  apiServerEgress:
    to: []
    ports:
    - 6443

# Odoo tickets and leads as conversations; staff replies go back to Odoo. See the README
odoo:
  enabled: false
  # https address of Odoo; required
  url: ""
  # Odoo database; empty: the server's only database
  database: ""
  # API inbox of helpdesk.ticket; created when missing
  ticketInbox: Support
  # API inbox of crm.lead; created when missing. Empty: leads are not mirrored
  leadInbox: Sales
  # a resolved conversation moves its ticket to the folded stage of this name (else to the
  # team's first folded stage)
  solvedStage: Solved
  # the live chat widget of a website as a Website inbox: the first visitor message opens an
  # Odoo ticket for the address the visitor gives (the pre-chat form asks for it), and every
  # public chat message is copied to the ticket as an internal note
  website:
    enabled: false
    # inbox name; created as a Website inbox when missing
    inbox: Website
    # https address of the site that embeds the widget; required with enabled
    url: ""
    # helpdesk team of chat tickets; empty: Odoo's default team
    team: ""
    # new chat tickets one address may open in 24 hours, and all addresses in one hour; over
    # a limit staff get a private note instead of a ticket
    ticketsPerEmail: 3
    ticketsPerHour: 20
    # Odoo partner of every chat ticket whose visitor the website did not verify (identity
    # below): the address typed in the pre-chat form can be anyone's, so it stays text in
    # the ticket. Created once by the bridge with ref chatwoot-website-visitor
    visitorPartner: Website visitor
    # new widget conversations one client address may start in a minute (Chatwoot's
    # RATE_LIMIT_WIDGET_CONVERSATIONS)
    conversationsPerMinute: 5
    # a chat with this label, added by staff or a staff automation, moves to a new crm.lead
    # with the transcript, and its ticket moves to the folded stage cancelledStage. A label
    # the visitor sets through the widget moves nothing. Must not be a triage label. The
    # prepare Job creates it in lower case when missing; ASCII letters, digits, - and _ only.
    # Empty: chats stay tickets
    salesLabel: sales
    cancelledStage: Cancelled
    # the message above the pre-chat form, Markdown (a link opens in a new tab), set by the
    # prepare Job; empty: the message set in Chatwoot stays
    preChatMessage: ""
    # Chatwoot identity validation on the Website inbox: the site signs the identifier of a
    # logged-in customer (their email) with the key secrets.websiteIdentityKey and passes it
    # to the widget (setUser with identifier_hash); a contact identifier without a valid
    # signature is refused. Only such a conversation counts as a logged-in customer
    identity:
      enabled: false
      # with agentBot.enabled: the bot's agent gets the logged-in customer's own partner,
      # sale orders, subscriptions and tickets, read by the bridge with secrets.odooApiKey.
      # The bridge then needs Odoo's address in networkPolicy.agentEgress
      records: true
  # leads made by the sales label (odoo.website.salesLabel)
  sales:
    # the label, added by staff on a conversation of ticketInbox, also moves it to sales: a
    # crm.lead from the ticket with the transcript, the ticket to cancelledStage, a new
    # conversation in leadInbox for the lead (the transcript as a private note), and the old
    # conversation resolved with a note that points to the new one. Needs leadInbox
    fromSupport: false
    # crm team of those leads and of website chat leads; empty: Odoo's default team
    team: ""
  # a panel in the conversation sidebar (Chatwoot Dashboard App) with what Odoo knows about
  # the customer: partner, sale orders, subscriptions, open and closed tickets, leads and
  # opportunities, and the issue keys staff put in x_jira_key with their status. Read only,
  # with the bridge's API key (give that Odoo user read access to Sales). Needs sso.enabled;
  # with copilotPanel.enabled it also shows the agent's summary in three lines
  panel:
    enabled: false
    # name of the panel's tab in the conversation sidebar
    title: Odoo
    # a Jira site for the status of linked issues
    issues:
      # https address of the site, for example https://example.atlassian.net; empty: issue
      # keys are shown without a link or status
      url: ""
      # Jira Cloud: the account email the API token belongs to (basic auth). Empty: the
      # token is a personal access token (Jira Data Center, bearer)
      user: ""
  bridge:
    image: registry.access.redhat.com/ubi9/python-312-minimal:9.8-1793637445
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 500m
        memory: 192Mi

# metrics of the Odoo bridge for the namespace's monitoring
monitoring:
  # a ServiceMonitor, and the scraping namespaces may reach the bridge's metrics port
  enabled: false
  # alert rules next to the ServiceMonitor; false where the platform alerts centrally
  alerts: true
  # label of the namespaces that may scrape
  namespaceLabels:
    network.openshift.io/policy-group: monitoring

# AI drafts: for each new customer message in the inboxes below, the agent drafts the next
# reply from the conversation and the bridge adds it as a private note, which staff check,
# edit and send themselves. Nothing of the draft path reaches the customer. The prepare Job
# keeps the drafts' author and an account webhook of new messages to the bridge
draftAgent:
  enabled: false
  # names of the inboxes whose customer messages get a draft; "*" is every inbox
  inboxes: []
  # the Chatwoot agent that writes the notes; the email stays under .invalid
  name: AI draft
  email: ai-draft@chatwoot.invalid
  # first line of every note; also how the bridge leaves earlier drafts out of the transcript
  heading: "AI draft (check before sending):"
  # what the agent reads before the transcript; empty: the bridge's own instruction
  instructions: ""
  # how often the bridge looks at the open conversations of the inboxes above for what a
  # webhook missed (a restart, an agent that was down): a customer message without a draft
  # and, with triage, a conversation not sorted yet. 0: never
  sweepSeconds: 60
  # conversations without activity for longer than this are left alone
  sweepMaxAgeHours: 24

# AI triage: before the draft, the agent sorts each new conversation of the draftAgent
# inboxes into one of the categories below. The bridge labels the conversation with the
# category, gives it to the category's team (Chatwoot assigns an online member of the team)
# and adds a private note with a summary. A conversation that already has a team or an
# assignee keeps it. An answer without a known category, or no answer, takes the fallback
# category. Removing the label of triage.label from a conversation sorts it again. The
# prepare Job switches Chatwoot's own auto assignment off in the draftAgent inboxes: it
# would give each new conversation to any online member before the triage. Needs
# draftAgent.enabled
triage:
  enabled: false
  # one per kind of question: name is the label (a-z, 0-9, - and _), team the Chatwoot team
  # that takes the conversation (empty: none), description tells the agent what belongs
  # there. For example
  #   - name: engineering
  #     team: engineering
  #     description: outages, errors, backups, access to a service
  categories: []
  # category of an answer that names no category, or of no answer; one of the names above
  fallback: ""
  # members of a team by email, for example engineering: [ann@example.com]. The prepare Job
  # keeps the teams of the categories and adds each listed member that has a Chatwoot user
  # (a user appears at the first login, and joins at the next install or upgrade), also to
  # the draftAgent inboxes, so the team can take conversations there. Members added in
  # Chatwoot stay
  teams: {}
  # label of every sorted conversation; the bridge sorts each conversation without it
  label: ai-triaged
  # first line of the triage note; must not start like draftAgent.heading
  heading: "AI triage:"
  # what the agent reads before the categories; empty: the bridge's own instruction
  instructions: ""

# Facts about the customer's tenant in the triage note, and so in the draft, read by the
# bridge from the Kubernetes API of this cluster: pods that are not ready, CronJobs, volume
# claims that are not bound, recent warning events and the Velero backups of each namespace
# of the tenant. The tenant comes from the conversation contact's email alone: the
# namespaces whose annotation emailAnnotation holds that email name the tenant in their
# label tenantLabel, and every namespace with that label belongs to it. The bridge reads no
# Secret and no ConfigMap. The sender's address is not verified: staff check it before they
# pass a fact on. ServiceAccount chatwoot-agent-bridge needs list on namespaces, pods,
# events, persistentvolumeclaims and cronjobs in every namespace and on velero.io schedules
# and backups in veleroNamespace; a chart creates no cluster role, so the cluster
# administrator binds one (see the README). Needs triage.enabled
tenantFacts:
  enabled: false
  # namespace annotation with the customer's email (several separated by commas); required
  emailAnnotation: ""
  # namespace label that names the tenant; required
  tenantLabel: ""
  # namespace of the Velero Schedules and Backups; empty: no backup facts
  veleroNamespace: ""
  # warning events of the last this many hours
  eventHours: 24
  # reasons of warning events that are no news to staff, for example PolicyViolation
  ignoreEventReasons: []

# The agent behind agentBot and copilotPanel: an A2A (Agent2Agent) server
agent:
  # JSON-RPC address of the agent (method message/send); required with either feature
  url: ""
  # seconds to wait for one answer
  timeoutSeconds: 300
  auth:
    # none: no credential. serviceAccountToken: a token of ServiceAccount
    # chatwoot-agent-bridge for auth.audience, renewed by the kubelet. clientAssertion: that
    # token is the client assertion (RFC 7523) of a client credentials grant at
    # auth.tokenUrl for auth.clientId, and the access token goes to the agent.
    # clientSecret: a client credentials grant with the client secret
    # secrets.agentClientSecret (Secret chatwoot-agent-client), for an OAuth server that
    # cannot tell this cluster's ServiceAccount tokens from another cluster's
    type: none
    # audience of the ServiceAccount token, with serviceAccountToken and clientAssertion
    audience: ""
    # token endpoint of the OAuth server, with clientAssertion and clientSecret
    tokenUrl: ""
    # OAuth client of the bridge, with clientAssertion and clientSecret
    clientId: ""
    # scope of the access token; empty: the client's default
    scope: ""

# An Agent Bot that answers customers through the agent until a person takes over. The
# prepare Job creates it and connects it to the inboxes below on every install and upgrade
agentBot:
  enabled: false
  # name of the bot in Chatwoot
  name: Assistant
  # names of the inboxes the bot answers in; "*" is every inbox. A listed inbox is taken
  # from any other bot; an inbox created later is connected on the next upgrade
  inboxes: []
  # A2A address of the bot's own agent, with agent.auth; empty: agent.url. A bot that
  # answers the public needs an agent without access to customer data: before every message
  # the bridge tells it whether the visitor is a customer the website verified
  # (odoo.website.identity), and with whose records
  agentUrl: ""
  # what the agent reads before the first message of each conversation
  instructions: >-
    You answer a customer in a support chat. Reply with the message for the customer only,
    in the customer's language. When a person must take over, reply with HANDOFF only.
  handoff:
    # a customer message that is exactly one of these (case and punctuation ignored)
    # hands the conversation to a person
    keywords:
    - human
    - person
    - agent
    - staff
    # an answer of the agent that holds this as a word of its own (case as written) hands
    # the conversation to a person; the customer gets message below, not that answer
    marker: HANDOFF
    # posted to the customer at a handoff; empty: nothing
    message: A colleague will take over this conversation.
  # posted to the customer when the agent does not answer; the conversation then goes to a
  # person. Empty: nothing
  failureMessage: Sorry, I cannot answer right now. A colleague will take over this conversation.
  # quotations from the chat: an answer of the agent that holds "<marker> {json}" never
  # reaches the visitor, none of it; the bridge passes the JSON to the quotation method of
  # an Odoo module (README, Quotations) with the bridge's Odoo key, so it needs
  # odoo.website.identity.records. Odoo checks products, options and limits, makes the
  # quotation on the verified customer's own partner or a new contact, and mails it; the
  # visitor gets sentMessage ({order}, {email}) or refusedMessage ({error}). A failure of
  # Odoo hands the conversation to a person
  quotations:
    enabled: false
    # the word before the JSON object, upper case; the agent's instructions must name it
    marker: QUOTE
    # to the visitor after Odoo sent the quotation; {order} and {email} only
    sentMessage: >-
      Quotation {order} is on its way to {email}. Review it in the customer portal, then sign
      and pay it there to order; nothing is ordered before that.
    # to the visitor when Odoo refused; {error} only
    refusedMessage: "I could not make that quotation: {error}"
    # to the visitor when Odoo made a lead instead of a quotation ("lead": true) and people
    # send the quotation; {email} only. Empty: the "message" of Odoo's answer
    leadMessage: "Thank you. We will send you a quotation at {email}."

# A panel in the conversation sidebar (Chatwoot Dashboard App) where staff ask the agent to
# summarise the conversation, suggest a reply or answer a question. Needs sso.enabled: the
# panel is served behind the staff login
copilotPanel:
  enabled: false
  # name of the panel's tab in the conversation sidebar
  title: Agent

# the pod of the agent bot and the panel
agentBridge:
  # https address of a bridge outside this release, for example a standalone release next
  # to the agent in another cluster. Chatwoot sends the bot's webhooks there, the panel
  # forwards each request there with the staff member's own access token, and the bridge
  # posts the bot's answers to the public address of Chatwoot. Empty: the bridge runs here
  remoteUrl: ""
  # a release of the bridge alone, next to the agent: no Chatwoot, only the bridge with a
  # Route that a Chatwoot release elsewhere names in agentBridge.remoteUrl. agentBot and
  # copilotPanel say what it serves; agent is the agent it asks
  standalone:
    enabled: false
    # public https address of that Chatwoot, for the bot's answers; required
    chatwootUrl: ""
    route:
      # empty: OpenShift assigns a host under the default application domain
      hostname: ""
      annotations:
        cert-manager.io/issuer-kind: ClusterIssuer
        cert-manager.io/issuer-name: letsencrypt
    # the access tokens of staff that panel requests carry (the staff login of that Chatwoot)
    staff:
      # OIDC issuer of the tokens; required with copilotPanel.enabled
      issuerUrl: ""
      # a token's azp (the OIDC client of that Chatwoot's login) must be one of these
      clientIds: []
      # a token's groups must hold one of these; empty: any member of the issuer
      allowedGroups: []
      groupsClaim: groups
  image: registry.access.redhat.com/ubi9/python-312-minimal:9.8-1793637445
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 500m
      memory: 192Mi

# MCP server for AI agents: list and read conversations, leave private notes; no tool sends
# anything to a contact. It calls Chatwoot web inside the release as one Chatwoot agent
# user (secrets.mcpToken). kube-rbac-proxy in front checks every call: the caller's
# ServiceAccount token must allow services/proxy on Service chatwoot-mcp. ServiceAccount
# chatwoot-mcp needs ClusterRole system:auth-delegator, which this chart cannot bind (a
# cluster-scoped object): an administrator binds it. See the README
mcp:
  enabled: false
  # a chatwoot-mcp image: streamable HTTP on port 8000 at /mcp; required with mcp.enabled
  image:
    repository: ""
    # a version tag
    tag: ""
    # IfNotPresent or Always
    pullPolicy: IfNotPresent
  # id of the Chatwoot account the tools work in
  accountId: 1
  # inbox ids post_private_note may write to; empty: every inbox of the MCP user. The user
  # reads only the inboxes it is a member of
  noteInboxIds: []
  # the organisation the server's instructions name the support desk after; empty: the
  # image's default
  organization: ""
  # tool prefix an MCP gateway that discovers the Service gives the tools (<name>_<tool>)
  targetName: chatwoot
  # ServiceAccounts allowed to call: [{kind: ServiceAccount, name, namespace}]
  callers: []
  # ServiceAccount chatwoot-mcp-caller with a long-lived token in Secret
  # chatwoot-mcp-caller-token, allowed to call: the identity of a gateway outside the
  # cluster
  callerAccount:
    enabled: false
  # https://<hostname>/mcp, reencrypted to the proxy
  route:
    enabled: false
    # empty: OpenShift assigns a host under the default application domain
    hostname: ""
    # with a hostname outside that domain, the cert-manager annotations of route.annotations
    annotations: {}
  # further host names the server answers with any port (MCP_ALLOWED_HOSTS), besides
  # mcp.route.hostname and, with mcp.callers, the Service names; with mcp.route.enabled and
  # no hostname, the host OpenShift assigns (<route>-<namespace>.<application domain>) is
  # required here
  allowedHosts: []
  # further peers (NetworkPolicyPeer) that may reach the proxy port 8443; the routers may
  # with mcp.route.enabled, the namespaces of mcp.callers always
  ingressFrom: []
  # kube-rbac-proxy in front of the server on port 8443
  rbacProxy:
    image: quay.io/brancz/kube-rbac-proxy:v0.23.0
    # resources of the proxy container
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 128Mi
  # resources of the server container
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

secrets:
  # kubernetes: Secrets from the values below. externalSecret: from a secret store
  type: kubernetes
  # key of Rails sessions and signed ids; empty: generated once and kept
  secretKeyBase: ""
  # password of the Valkey store; empty: generated once and kept
  redisPassword: ""
  # password of the super admin; empty: generated once and kept
  superAdminPassword: ""
  # access token of the login bridge's Platform App, with sso.enabled; empty: generated
  platformToken: ""
  # secret of the OIDC client, with sso.enabled; empty: generated
  oauthClientSecret: ""
  # cookie secret of oauth2-proxy, with sso.enabled; empty: generated
  oauthCookieSecret: ""
  # access token of the agent bot, with agentBot.enabled; empty: generated
  agentBotToken: ""
  # secret Chatwoot signs the agent bot's webhooks with, with agentBot.enabled; empty:
  # generated
  agentBotWebhookSecret: ""
  # access token of the AI drafts' author, with draftAgent.enabled; empty: generated
  draftToken: ""
  # secret Chatwoot signs the drafts' account webhook with, with draftAgent.enabled; empty:
  # generated
  draftWebhookSecret: ""
  # client secret of the bridge at agent.auth.tokenUrl, with agent.auth.type clientSecret;
  # required
  agentClientSecret: ""
  # API key of the Odoo user the bridge works as, with odoo.enabled; required
  odooApiKey: ""
  # secret Odoo signs its events with (the bridge secret of the Odoo module), with
  # odoo.enabled; empty: generated, then give Odoo the same value
  odooEventSecret: ""
  # access token of the bridge's Chatwoot agent, with odoo.enabled; empty: generated
  odooBridgeToken: ""
  # secret Chatwoot signs the API inboxes' webhooks with, with odoo.enabled; empty:
  # generated
  odooInboxSecret: ""
  # API token of the Jira site, with odoo.panel.issues.url; required (read access to the
  # linked issues is enough)
  issueTrackerToken: ""
  # identity validation key of the Website inbox, with odoo.website.identity.enabled; the
  # site that signs customers needs the same value. Empty: generated once and kept
  websiteIdentityKey: ""
  # access token of the Chatwoot agent user the MCP server works as, with mcp.enabled;
  # required (an agent bot token cannot list conversations)
  mcpToken: ""
  externalSecret:
    storeKind: ClusterSecretStore
    storeName: ""
    refreshInterval: 1h
    # vault item per key; the value is read from the item's password
    items:
      secret-key-base: chatwoot-secret-key-base
      redis-password: chatwoot-redis
      super-admin-password: chatwoot-super-admin
      platform-token: chatwoot-platform-token
      client-secret: chatwoot-oidc-client
      cookie-secret: chatwoot-oauth-cookie
      bot-token: chatwoot-agent-bot-token
      webhook-secret: chatwoot-agent-bot-webhook
      draft-token: chatwoot-draft-token
      draft-webhook-secret: chatwoot-draft-webhook
      agent-client-secret: chatwoot-agent-client-secret
      odoo-api-key: chatwoot-odoo-api-key
      odoo-event-secret: chatwoot-odoo-event-secret
      odoo-bridge-token: chatwoot-odoo-bridge-token
      odoo-inbox-secret: chatwoot-odoo-inbox-secret
      issue-tracker-token: chatwoot-issue-tracker-token
      website-identity-key: chatwoot-website-identity-key
      mcp-token: chatwoot-mcp-token
