{{- /*
Up to four Secrets, so each pod mounts only what it needs:
  chatwoot-credentials  web, worker, Job, Valkey: secret-key-base, redis-password,
                        super-admin-password
  chatwoot-platform     the login bridge and the Job only: platform-token
  chatwoot-oauth        oauth2-proxy only: client-secret, cookie-secret
  chatwoot-agent-bot    the agent bridge and the Job only: bot-token, webhook-secret
A value wins; else the value already in the cluster; else a new one.
*/}}
{{- $sso := .Values.sso.enabled }}
{{- $s := .Values.secrets }}
{{- $sets := list
  (dict "name" "chatwoot-credentials" "keys" (list
    (dict "key" "secret-key-base" "value" $s.secretKeyBase "length" 128)
    (dict "key" "redis-password" "value" $s.redisPassword "length" 32)
    (dict "key" "super-admin-password" "value" $s.superAdminPassword "length" 32 "complex" true)))
}}
{{- if $sso }}
{{- $sets = append $sets (dict "name" "chatwoot-platform" "keys" (list
    (dict "key" "platform-token" "value" $s.platformToken "length" 48))) }}
{{- $sets = append $sets (dict "name" "chatwoot-oauth" "keys" (list
    (dict "key" "client-secret" "value" $s.oauthClientSecret "length" 32)
    (dict "key" "cookie-secret" "value" $s.oauthCookieSecret "length" 32))) }}
{{- end }}
{{- if .Values.agentBot.enabled }}
{{- $sets = append $sets (dict "name" "chatwoot-agent-bot" "keys" (list
    (dict "key" "bot-token" "value" $s.agentBotToken "length" 48)
    (dict "key" "webhook-secret" "value" $s.agentBotWebhookSecret "length" 48))) }}
{{- end }}
{{- range $i, $set := $sets }}
{{- if $i }}
---
{{- end }}
{{- if eq $s.type "kubernetes" }}
{{- $found := lookup "v1" "Secret" $.Release.Namespace $set.name }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $set.name }}
  annotations:
    # before the Route: the platform copies the OIDC client secret when it admits the Route
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: chatwoot
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/component: credentials
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $set.keys }}
  {{- if .value }}
  {{- /* Chatwoot asks a password for upper and lower case, a digit and a sign */}}
  {{ .key }}: {{ (ternary (printf "%s-Aa1" .value) .value (default false .complex)) | b64enc | quote }}
  {{- else if hasKey $existing .key }}
  {{ .key }}: {{ index $existing .key | quote }}
  {{- else }}
  {{ .key }}: {{ (ternary (printf "%s-Aa1" (randAlphaNum (int .length))) (randAlphaNum (int .length)) (default false .complex)) | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
{{- $es := $s.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $set.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app: chatwoot
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/component: credentials
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: {{ $set.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $set.keys }}
  - secretKey: {{ .key }}
    remoteRef:
      key: {{ required (printf "secrets.externalSecret.items.%s is required" .key) (index $es.items .key) }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
{{- end }}
