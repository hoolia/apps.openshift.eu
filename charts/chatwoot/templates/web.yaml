{{- if not (include "wrapper.standalone" .) }}
{{- $volume := eq .Values.attachments.storage "volume" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatwoot-web
  labels:
    app: chatwoot-web
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/component: server
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
  annotations:
    app.openshift.io/custom-icon: {{ .Chart.Icon }}
    app.openshift.io/vcs-uri: https://github.com/chatwoot/chatwoot
    app.openshift.io/connects-to: '[{"apiVersion":"postgresql.cnpg.io/v1","kind":"Cluster","name":"chatwoot-db"},{"apiVersion":"apps/v1","kind":"Deployment","name":"chatwoot-redis"}]'
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ ternary 1 .Values.web.replicas $volume }}
  {{- if $volume }}
  # the attachments volume is ReadWriteOnce
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwoot-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-web
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") (merge (dict "checksum" true) .) | sha256sum }}
    spec:
      {{- include "wrapper.serviceAccount" . | nindent 6 }}
      securityContext:
        {{- include "wrapper.podSecurity" . | nindent 8 }}
      initContainers:
      {{- if not .Values.route.hostname }}
      {{- include "wrapper.routeHostInit" . | nindent 6 }}
      {{- end }}
      # /health answers before the database is usable: wait for the schema and pgvector
      - name: wait-database
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: {{ include "wrapper.start" (list "bundle" "exec" "rails" "runner" "/scripts/wait_ready.rb") }}
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        {{- include "wrapper.volumeMounts" . | nindent 8 }}
        resources:
          {{- toYaml .Values.web.resources | nindent 10 }}
      containers:
      - name: web
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: {{ include "wrapper.start" (list "bundle" "exec" "rails" "server" "-b" "0.0.0.0" "-p" "3000") }}
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        {{- include "wrapper.volumeMounts" . | nindent 8 }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          {{- toYaml .Values.web.resources | nindent 10 }}
      volumes:
      {{- include "wrapper.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chatwoot-web
  labels:
    app: chatwoot-web
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/component: server
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: chatwoot-web
  ports:
  - name: http
    port: 3000
    targetPort: http
{{- end }}
