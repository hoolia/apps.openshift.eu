{{- /*
Migrates the database and sets up the account, the super admin and the login bridge's
Platform App, on every install and upgrade; web and worker wait in their init container
until it is done (files/wait_ready.rb).
- Argo CD runs it as a Sync hook in wave 1: after the database and the store (wave 0),
  before web and worker (wave 2).
- Plain Helm creates it as an ordinary object of the release, named after the revision so
  each upgrade runs a new one and removes the old. No Helm hook: Helm runs a post-install
  hook only after --wait found web ready, and web waits for this Job.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: chatwoot-prepare-{{ .Release.Revision }}
  labels:
    app: chatwoot-prepare
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/component: migration
    {{- include "chatwoot.commonLabels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot-prepare
    spec:
      restartPolicy: OnFailure
      {{- include "wrapper.serviceAccount" . | nindent 6 }}
      securityContext:
        {{- include "wrapper.podSecurity" . | nindent 8 }}
      initContainers:
      {{- if not .Values.route.hostname }}
      {{- include "wrapper.routeHostInit" . | nindent 6 }}
      {{- end }}
      # plain Helm starts this Job together with the database: wait for it and pgvector
      - name: wait-database
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: {{ include "wrapper.start" (list "bundle" "exec" "rails" "runner" "/scripts/wait_ready.rb") }}
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        - name: CHATWOOT_WAIT_FOR
          value: database
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        {{- include "wrapper.volumeMounts" (merge (dict "job" true) .) | nindent 8 }}
        resources:
          {{- toYaml .Values.prepare.resources | nindent 10 }}
      containers:
      - name: prepare
        image: {{ include "wrapper.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: {{ include "wrapper.start" (list "/bin/sh" "-ec" "bundle exec rails db:chatwoot_prepare\nexec bundle exec rails runner /scripts/bootstrap.rb") }}
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        - name: POSTGRES_STATEMENT_TIMEOUT
          value: 600s
        - name: CHATWOOT_ACCOUNT_NAME
          value: {{ .Values.account.name | quote }}
        - name: CHATWOOT_ADMIN_EMAIL
          value: {{ include "wrapper.adminEmail" . | quote }}
        - name: CHATWOOT_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatwoot-credentials
              key: super-admin-password
        {{- if .Values.sso.enabled }}
        - name: CHATWOOT_PLATFORM_APP
          value: login-bridge
        - name: CHATWOOT_PLATFORM_TOKEN
          valueFrom:
            secretKeyRef:
              name: chatwoot-platform
              key: platform-token
        {{- end }}
        {{- if .Values.agentBot.enabled }}
        - name: CHATWOOT_AGENT_BOT_NAME
          value: {{ .Values.agentBot.name | quote }}
        - name: CHATWOOT_AGENT_BOT_URL
          value: {{ include "wrapper.agentBotUrl" . }}webhook
        - name: CHATWOOT_AGENT_BOT_INBOXES
          value: {{ join "," .Values.agentBot.inboxes | quote }}
        - name: CHATWOOT_AGENT_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: chatwoot-agent-bot
              key: bot-token
        - name: CHATWOOT_AGENT_BOT_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: chatwoot-agent-bot
              key: webhook-secret
        {{- end }}
        {{- if .Values.copilotPanel.enabled }}
        - name: CHATWOOT_AGENT_PANEL_TITLE
          value: {{ .Values.copilotPanel.title | quote }}
        - name: CHATWOOT_AGENT_PANEL_PATH
          value: /agent-panel/
        {{- end }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        {{- include "wrapper.volumeMounts" (merge (dict "job" true) .) | nindent 8 }}
        resources:
          {{- toYaml .Values.prepare.resources | nindent 10 }}
      volumes:
      {{- include "wrapper.volumes" (merge (dict "job" true) .) | nindent 6 }}
