{{- $name := include "hermes.name" . }}
{{- $secret := printf "%s-cookie-secret" $name }}
{{- $item := .Values.secrets.externalSecret.items.cookieSecret }}
{{- if and (eq .Values.secrets.type "externalSecret") $item }}
{{- $store := required "secrets.externalSecret.storeName is required" .Values.secrets.externalSecret.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "hermes.namespace" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: value
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if not $cookie }}
{{- $found := lookup "v1" "Secret" (include "hermes.namespace" .) $secret }}
{{- if and $found $found.data (hasKey $found.data "value") }}
{{- $cookie = index $found.data "value" | b64dec }}
{{- else }}
{{- $cookie = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- /* oauth-proxy accepts a cookie secret of 16, 24 or 32 bytes only */}}
{{- if not (has (len $cookie) (list 16 24 32)) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "hermes.namespace" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  value: {{ $cookie | b64enc | quote }}
{{- end }}
{{- if .Values.a2a.enabled }}
---
{{- $name := include "hermes.name" . }}
{{- $secret := printf "%s-a2a" $name }}
{{- $item := .Values.secrets.externalSecret.items.a2aToken }}
{{- if and (eq .Values.secrets.type "externalSecret") $item }}
{{- $store := required "secrets.externalSecret.storeName is required" .Values.secrets.externalSecret.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "hermes.namespace" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: token
    remoteRef:
      key: {{ $item }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
{{- $token := .Values.secrets.a2aToken }}
{{- if not $token }}
{{- $found := lookup "v1" "Secret" (include "hermes.namespace" .) $secret }}
{{- if and $found $found.data (hasKey $found.data "token") }}
{{- $token = index $found.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "hermes.namespace" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
{{- end }}
