{{- $name := include "hermes.name" . }}
{{- $ns := include "hermes.namespace" . }}
{{- $es := .Values.secrets.externalSecret }}
{{- $useES := eq .Values.secrets.type "externalSecret" }}
{{- if and $useES $es.items.approvalSigningKey (not .Values.approvalSigning.secretName) }}
{{- $store := required "secrets.externalSecret.storeName is required" $es.storeName }}
---
# the approval signing key, for container gateway only
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-approval-signing
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}-approval-signing
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: {{ .Values.approvalSigning.key }}
    remoteRef:
      key: {{ $es.items.approvalSigningKey }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- range .Values.skills.repositories }}
{{- if and .externalSecret (not .secretName) }}
{{- if not $useES }}{{ fail (printf "skills.repositories %s: externalSecret needs secrets.type externalSecret" .name) }}{{ end }}
{{- $store := required "secrets.externalSecret.storeName is required" $es.storeName }}
---
# deploy key of skill repository {{ .name }}, in the shape of an Argo CD repository Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-skills-{{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" $ | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $store }}
  target:
    name: {{ $name }}-skills-{{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        type: git
        url: {{ .url | quote }}
        # the vault item's note is the private key, several lines
        sshPrivateKey: {{ "{{ .sshPrivateKey }}" | quote }}
  data:
  - secretKey: sshPrivateKey
    remoteRef:
      key: {{ .externalSecret }}
      property: notes
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
