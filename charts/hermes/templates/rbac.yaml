{{- $name := include "hermes.name" . }}
{{- $ns := include "hermes.namespace" . }}
# mcp-sync reads the OAuth client Secrets that RemoteMCPServers name, in this namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-mcp-clients
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-mcp-clients
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-mcp-clients
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $ns }}
{{- if and .Values.mcp.enabled .Values.mcp.clusterRole }}
---
# mcp-sync lists the namespace's RemoteMCPServers; the ClusterRole comes with kagent
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-discovery-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.mcp.clusterRole }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $ns }}
{{- end }}
{{- $clusterRole := .Values.oauth.loginClusterRole }}
{{- if not $clusterRole }}
---
# the login proxy admits a user only with this permission (SAR)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-login
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
- apiGroups:
  - ""
  resources:
  - services/proxy
  resourceNames:
  - {{ $name }}-ui
  verbs:
  - login
{{- end }}
{{- if .Values.oauth.allowedGroups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # roleRef is immutable: a ClusterRole binding has its own name
  name: {{ $name }}-{{ ternary "app-login" "login" (not (empty $clusterRole)) }}
  namespace: {{ $ns }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" (not (empty $clusterRole)) }}
  name: {{ default (printf "%s-login" $name) $clusterRole }}
subjects:
{{- range .Values.oauth.allowedGroups }}
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ . }}
{{- end }}
{{- end }}
