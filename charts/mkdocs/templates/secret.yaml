{{- if eq .Values.secrets.type "kubernetes" }}
{{- if and .Values.source.gitRepo .Values.source.private }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mkdocs.fullname" . }}-git
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.source.gitUsername | quote }}
  password: {{ .Values.secrets.gitPassword | quote }}
---
{{- end }}
{{- if .Values.oauth.enabled }}
{{- $name := printf "%s-oauth" (include "mkdocs.fullname" .) }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existing := dict }}
{{- if $found }}{{- $existing = $found.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  client-secret: {{ required "secrets.clientSecret is required when oauth.enabled" .Values.secrets.clientSecret | b64enc | quote }}
  cookie-secret: {{ include "mkdocs.secretValue" (dict "value" .Values.secrets.cookieSecret "existing" $existing "key" "cookie-secret" "length" 32) | quote }}
{{- end }}
{{- end }}
