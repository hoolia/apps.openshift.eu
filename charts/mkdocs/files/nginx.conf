# MkDocs writes 404.html at the site root
error_page 404 /404.html;

# probe target; open to the kubelet also when the site itself is closed
location = /healthz {
    access_log off;
    allow all;
    return 204;
}

# pages: revalidate, so a new build is visible at once
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

# fingerprinted theme assets
location /assets/stylesheets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /assets/javascripts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
