apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-playwright.fullname" . }}
  namespace: {{ include "mcp-playwright.namespace" . }}
  labels:
    {{- include "mcp-playwright.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    agentgateway.dev/mcp-path: /mcp
    agentgateway.dev/mcp-target-name: {{ .Values.mcp.targetName | default (include "mcp-playwright.fullname" .) | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-playwright.selectorLabels" . | nindent 4 }}
  ports:
  - name: mcp
    port: {{ .Values.port }}
    targetPort: mcp
    protocol: TCP
    {{- with .Values.mcp.appProtocol }}
    appProtocol: {{ . }}
    {{- end }}
