{{- if .Values.serviceAccount.clusterRole }}
# The agent acts on its own namespace only, never cluster-wide
# The role is in the name: an upgrade cannot change a roleRef
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opencode-agent.name" . }}-{{ .Values.serviceAccount.clusterRole }}
  namespace: {{ include "opencode-agent.namespace" . }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccount.clusterRole | quote }}
subjects:
- kind: ServiceAccount
  name: {{ include "opencode-agent.serviceAccountName" . }}
  namespace: {{ include "opencode-agent.namespace" . }}
{{- end }}
