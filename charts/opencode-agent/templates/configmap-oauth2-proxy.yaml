apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencode-agent.name" . }}-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "opencode-agent.name" . }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
data:
  # The owner only; empty: nobody logs in
  emails.txt: |
    {{- with .Values.person.email }}
    {{ . }}
    {{- end }}
  # Alpha config: the only way to inject a static upstream Authorization header
  alpha-config.yaml: |
    server:
      BindAddress: 0.0.0.0:{{ .Values.oauth2Proxy.port }}
    upstreamConfig:
      upstreams:
      - id: opencode
        path: /
        uri: http://127.0.0.1:4096
        # The UI streams over SSE: flush at once, keep long requests open
        flushInterval: 1s
        timeout: {{ .Values.route.timeout }}
        passHostHeader: true
        proxyWebSockets: true
    injectRequestHeaders:
    - name: Authorization
      values:
      - fromFile: /var/run/secrets/opencode/basic-auth-header
    providers:
    - id: keycloak
      provider: keycloak-oidc
      clientID: {{ include "opencode-agent.clientId" . | quote }}
      {{- if include "opencode-agent.confidential" . }}
      clientSecretFile: /var/run/secrets/oidc/clientSecret
      {{- end }}
      code_challenge_method: S256
      scope: {{ .Values.oauth.scope | quote }}
      {{- with .Values.oauth.allowedGroups }}
      allowedGroups:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      oidcConfig:
        issuerURL: {{ .Values.oauth.issuerUrl | trimSuffix "/" | quote }}
        emailClaim: email
        groupsClaim: {{ .Values.oauth.groupsClaim | quote }}
        audienceClaims:
        - aud
        - azp
        insecureSkipNonce: false
