{{- if and .Values.serviceAccount.name (ne .Values.serviceAccount.name (include "opencode-agent.name" .)) }}
# kagent creates the account named after the Agent; any other name is ours
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "opencode-agent.name" $ }}
    app.kubernetes.io/name: opencode-agent
    app.kubernetes.io/component: server
    {{- include "opencode-agent.commonLabels" $ | nindent 4 }}
{{- end }}
