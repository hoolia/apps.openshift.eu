{{- $s := .Values.secrets }}
{{- $secret := include "mcp-higgsfield.secret" . }}
{{- if and .Values.enabled $secret (not $s.existingSecret) }}
{{- if eq $s.type "externalSecret" }}
{{- $e := $s.externalSecret }}
{{- $item := default (printf "%s-%s" .Release.Name (include "mcp-higgsfield.name" .)) $e.item }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-higgsfield.namespace" . }}
  labels:
    app: {{ include "mcp-higgsfield.name" . }}
    app.kubernetes.io/name: mcp-higgsfield
    app.kubernetes.io/component: credentials
    {{- include "mcp-higgsfield.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    kind: {{ $e.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $e.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $prop := dict "HF_API_KEY" $e.apiKeyProperty "HF_SECRET" $e.apiSecretProperty }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ $item }}
      property: {{ $prop }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-higgsfield.namespace" . }}
  labels:
    app: {{ include "mcp-higgsfield.name" . }}
    app.kubernetes.io/name: mcp-higgsfield
    app.kubernetes.io/component: credentials
    {{- include "mcp-higgsfield.commonLabels" . | nindent 4 }}
type: Opaque
data:
  HF_API_KEY: {{ $s.apiKey | b64enc | quote }}
  HF_SECRET: {{ $s.apiSecret | b64enc | quote }}
{{- end }}
{{- end }}
