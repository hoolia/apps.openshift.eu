apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  # the data volume is ReadWriteOnce: the old pod must release it first
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/route-host.yaml") . | sha256sum }}
    spec:
      {{- include "wrapper.podSpec" . | nindent 6 }}
      containers:
      - name: n8n
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        command: ["tini", "--", "/bin/sh", "/scripts/start.sh"]
        ports:
        - name: http
          containerPort: 5678
        env:
        {{- include "wrapper.env" . | nindent 8 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /home/node
        - name: scripts
          mountPath: /scripts
        - name: db-ca
          mountPath: /db-ca
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-data
      {{- include "wrapper.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app.kubernetes.io/name: n8n
  ports:
  - name: http
    port: 5678
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: n8n
  {{- if and .Values.route.hostname .Values.route.annotations }}
  annotations:
    {{- toYaml .Values.route.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.route.hostname }}
  host: {{ .Values.route.hostname }}
  {{- end }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: n8n
    weight: 100
  wildcardPolicy: None
