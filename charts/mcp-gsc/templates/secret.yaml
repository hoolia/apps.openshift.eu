{{- $s := .Values.secrets }}
{{- if and (include "mcp-gsc.ready" .) (not $s.existingSecret) }}
{{- $secret := include "mcp-gsc.secret" . }}
{{- if eq $s.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-gsc.namespace" . }}
  labels:
    app: {{ include "mcp-gsc.name" . }}
    app.kubernetes.io/name: mcp-gsc
    app.kubernetes.io/component: credentials
    {{- include "mcp-gsc.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.externalSecret.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $s.externalSecret.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: credentials.json
    remoteRef:
      key: {{ default (printf "%s-%s" .Release.Name (include "mcp-gsc.name" .)) $s.externalSecret.item }}
      property: {{ $s.externalSecret.property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-gsc.namespace" . }}
  labels:
    app: {{ include "mcp-gsc.name" . }}
    app.kubernetes.io/name: mcp-gsc
    app.kubernetes.io/component: credentials
    {{- include "mcp-gsc.commonLabels" . | nindent 4 }}
type: Opaque
data:
  credentials.json: {{ $s.serviceAccountJson | b64enc | quote }}
{{- end }}
{{- end }}
