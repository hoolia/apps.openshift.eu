{{- if .Values.tls.openshift.injectServiceCa }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-service-ca
  namespace: {{ .Release.Namespace }}
  labels:
    app: codex-worker
    app.kubernetes.io/name: codex-worker
    app.kubernetes.io/component: worker
    {{- include "codex-worker.commonLabels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
{{- end }}
