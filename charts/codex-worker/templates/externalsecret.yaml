{{- if eq .Values.secrets.type "externalSecret" }}
{{- $credentials := list
  (dict "suffix" "worker-token" "existing" .Values.secrets.workerTokenSecret "item" .Values.secrets.externalSecret.items.workerToken)
  (dict "suffix" "auth-store-token" "existing" .Values.secrets.authStoreTokenSecret "item" .Values.secrets.externalSecret.items.authStoreToken)
}}
{{- range $credential := $credentials }}
{{- if not $credential.existing }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Release.Name }}-{{ $credential.suffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: codex-worker
    app.kubernetes.io/name: codex-worker
    app.kubernetes.io/component: credentials
    {{- include "codex-worker.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secrets.externalSecret.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $.Values.secrets.externalSecret.storeName | quote }}
  target:
    name: {{ $.Release.Name }}-{{ $credential.suffix }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        token: "{{ "{{ .value }}" }}"
  data:
  - secretKey: value
    remoteRef:
      key: {{ required (printf "secrets.externalSecret.items.%s.key is required" $credential.suffix) $credential.item.key | quote }}
      property: {{ $credential.item.property | quote }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
{{- end }}
