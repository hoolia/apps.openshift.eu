{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: codex-worker
    app.kubernetes.io/name: codex-worker
    app.kubernetes.io/component: worker
    {{- include "codex-worker.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: codex-worker
      app.kubernetes.io/part-of: {{ .Release.Name | quote }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.runnerNamespaceSelector | nindent 8 }}
    ports:
    - protocol: TCP
      port: 3443
  {{- if .Values.monitoring.enabled }}
  - from:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 8 }}
    ports:
    - protocol: TCP
      port: 3443
  {{- end }}
  egress:
  - to:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.egress.dnsNamespaceSelector | nindent 8 }}
    ports:
    {{- range .Values.networkPolicy.egress.dnsPorts }}
    - protocol: UDP
      port: {{ . }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  - to:
    {{- range .Values.networkPolicy.egress.httpsCidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
    {{- end }}
    ports:
    - protocol: TCP
      port: 443
{{- end }}
