apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: codex-worker
    app.kubernetes.io/name: codex-worker
    app.kubernetes.io/component: worker
    {{- include "codex-worker.commonLabels" . | nindent 4 }}
  {{- if .Values.tls.openshift.enabled }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Release.Name }}-tls
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: codex-worker
    app.kubernetes.io/part-of: {{ .Release.Name | quote }}
  ports:
  - name: https
    port: 3443
    targetPort: https
    protocol: TCP
