{{- if and .Values.kagent.enabled (.Capabilities.APIVersions.Has "kagent.dev/v1alpha2/Agent") }}
{{- range include "accountant-agent.roles" . | fromJsonArray }}
---
# kagent runs a BYO agent as its own Deployment on port 8080; that pod relays to the
# role's port of the agent Service. Card: /api/a2a/<namespace>/<name>/.well-known/agent.json
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    app.kubernetes.io/name: accountant-agent
    app.kubernetes.io/component: a2a
    {{- include "accountant-agent.commonLabels" $ | nindent 4 }}
spec:
  type: BYO
  description: {{ .description | quote }}
  byo:
    deployment:
      image: {{ include "accountant-agent.image" $ }}
      imagePullPolicy: {{ $.Values.image.pullPolicy }}
      cmd: python3
      args:
      - -m
      - accountant_agent.relay
      # an existing account: kagent creates none, and the relay needs no API access
      serviceAccountName: default
      env:
      - name: UPSTREAM
        value: http://{{ $.Release.Name }}.{{ $.Release.Namespace }}.svc:{{ .port }}
      resources:
        {{- toYaml $.Values.kagent.resources | nindent 8 }}
{{- end }}
{{- end }}
