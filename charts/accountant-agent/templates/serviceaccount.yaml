# identity of the agent: its projected tokens are the bearer of model and MCP calls
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: accountant-agent
    app.kubernetes.io/component: server
    {{- include "accountant-agent.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
