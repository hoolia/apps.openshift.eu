{{- if .Values.mcp.enabled }}
{{- $s := include "searxng.fullname" . }}
{{- $name := printf "%s-mcp" $s }}
{{- $ns := .Release.Namespace }}
{{- $hosts := list "localhost" "127.0.0.1" }}
{{- range $h := list $name (printf "%s.%s" $name $ns) (printf "%s.%s.svc" $name $ns) (printf "%s.%s.svc.cluster.local" $name $ns) }}
{{- $hosts = concat $hosts (list $h (printf "%s:%v" $h $.Values.mcp.port)) }}
{{- end }}
{{- $hosts = concat $hosts .Values.mcp.allowedHosts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: searxng-mcp
    app.kubernetes.io/component: mcp
    {{- include "searxng.commonLabels" . | nindent 4 }}
    app.openshift.io/runtime: nodejs
  annotations:
    app.openshift.io/connects-to: {{ list (dict "apiVersion" "apps/v1" "kind" "Deployment" "name" $s) | toJson | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "searxng.mcpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "searxng.mcpSelectorLabels" . | nindent 8 }}
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mcp
        image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
        imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
        env:
        - name: SEARXNG_URL
          value: "http://{{ $s }}:{{ .Values.port }}"
        - name: MCP_HTTP_PORT
          value: {{ .Values.mcp.port | quote }}
        - name: MCP_HTTP_HOST
          value: 0.0.0.0
        # Host header values it answers; a gateway forwards the public one
        - name: MCP_HTTP_ALLOWED_HOSTS
          value: {{ join "," $hosts | quote }}
        - name: HOME
          value: /tmp
        {{- range $k, $v := .Values.mcp.extraEnv }}
        - name: {{ $k }}
          value: {{ $v | toString | quote }}
        {{- end }}
        ports:
        - name: mcp
          containerPort: {{ .Values.mcp.port }}
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 10
        resources:
          {{- toYaml .Values.mcp.resources | nindent 10 }}
        securityContext:
          {{- include "searxng.restricted" . | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: searxng-mcp
    app.kubernetes.io/component: mcp
    {{- include "searxng.commonLabels" . | nindent 4 }}
    {{- with .Values.mcp.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    agentgateway.dev/mcp-path: {{ .Values.mcp.path | quote }}
    agentgateway.dev/mcp-target-name: {{ .Values.mcp.targetName | default .Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "searxng.mcpSelectorLabels" . | nindent 4 }}
  ports:
  - name: mcp
    port: {{ .Values.mcp.port }}
    targetPort: mcp
    protocol: TCP
    {{- with .Values.mcp.appProtocol }}
    appProtocol: {{ . }}
    {{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Callers: the own project and the gateway; it reaches DNS, its SearXNG and the public
# internet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: searxng-mcp
    app.kubernetes.io/component: mcp
    {{- include "searxng.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "searxng.mcpSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.mcp.port }}
    from:
    - podSelector: {}
    {{- range .Values.mcp.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "searxng.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.port }}
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
    ports:
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # web_url_read fetches pages from the public internet
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- range concat .Values.mcp.egressExceptCidrs .Values.mcp.extraEgressExceptCidrs }}
        - {{ . }}
        {{- end }}
{{- end }}
{{- end }}
