{{- $s := .Values.secrets }}
{{- if not $s.existingSecret }}
{{- $name := include "searxng.fullname" . }}
{{- if eq $s.type "externalSecret" }}
{{- $e := $s.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: credentials
    {{- include "searxng.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    kind: {{ $e.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $e.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: SEARXNG_SECRET
    remoteRef:
      key: {{ $e.item | default (printf "%s-secret" $name) }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
{{- $found := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := "" }}
{{- if and $found (hasKey $found.data "SEARXNG_SECRET") }}{{ $old = index $found.data "SEARXNG_SECRET" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: credentials
    {{- include "searxng.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- if $s.secretKey }}
  SEARXNG_SECRET: {{ $s.secretKey | b64enc | quote }}
  {{- else if $old }}
  SEARXNG_SECRET: {{ $old | quote }}
  {{- else }}
  SEARXNG_SECRET: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
