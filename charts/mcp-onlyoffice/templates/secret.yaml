{{- if .Values.enabled }}
{{- $secret := include "mcp-onlyoffice.jwtSecret" . }}
{{- $s := .Values.secrets }}
{{- if not .Values.documentServer.existingSecret }}
{{- if eq $s.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-onlyoffice.namespace" . }}
  labels:
    app: {{ include "mcp-onlyoffice.name" . }}
    app.kubernetes.io/name: mcp-onlyoffice
    app.kubernetes.io/component: credentials
    {{- include "mcp-onlyoffice.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.externalSecret.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $s.externalSecret.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: {{ .Values.documentServer.jwtSecretKey }}
    remoteRef:
      key: {{ default $secret $s.externalSecret.item }}
      property: {{ $s.externalSecret.property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else if $s.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-onlyoffice.namespace" . }}
  labels:
    app: {{ include "mcp-onlyoffice.name" . }}
    app.kubernetes.io/name: mcp-onlyoffice
    app.kubernetes.io/component: credentials
    {{- include "mcp-onlyoffice.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.documentServer.jwtSecretKey }}: {{ $s.jwtSecret | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
