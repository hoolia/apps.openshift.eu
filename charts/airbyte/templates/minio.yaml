{{- if .Values.minio.enabled }}
{{- $name := .Values.global.storage.secretName | default "airbyte-minio-credentials" }}
{{- if eq .Values.secrets.type "kubernetes" }}
{{- if .Values.secrets.minioRootPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: credentials
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.minioRootPassword | quote }}
{{- else }}
# Creates the Secret with a random password once, inside the cluster, before the first
# sync; a later render never sees or changes it
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: credentials
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-credentials
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.upstream.airbyteBootloader.serviceAccountName | default "airbyte-bootloader" }}
      containers:
      - name: create
        image: "{{ .Values.connections.image.repository }}:{{ .Values.connections.image.tag }}"
        imagePullPolicy: {{ .Values.connections.image.pullPolicy }}
        command:
        - python3
        - -c
        - {{ .Files.Get "files/ensure-secret.py" | quote }}
        env:
        - name: SECRET_NAME
          value: {{ $name }}
        - name: FIXED_KEYS
          value: {{ dict "AWS_ACCESS_KEY_ID" .Values.minio.rootUser | toJson | quote }}
        - name: RANDOM_KEYS
          value: AWS_SECRET_ACCESS_KEY
        - name: LABELS
          value: {{ dict "app" "airbyte-minio" "app.kubernetes.io/name" "minio" "app.kubernetes.io/component" "credentials" | toJson | quote }}
        resources:
          {{- toYaml .Values.connections.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.containerSecurityContext" . | nindent 10 }}
{{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  # the name upstream's default MinIO endpoint points at
  name: airbyte-minio-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: s3
    port: 9000
    targetPort: s3
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airbyte-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.openshift.io/runtime: openshift
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
spec:
  serviceName: airbyte-minio-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: minio
        image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
        imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
        args:
        - server
        - /data
        - --address
        - :9000
        - --console-address
        - :9001
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - for i in $(seq 1 60); do mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc mb --ignore-existing local/{{ .Values.minio.bucket }} && exit 0; sleep 2; done; exit 1
        env:
        - name: MC_CONFIG_DIR
          value: /tmp/.mc
        - name: HOME
          value: /tmp
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.storage.secretName | default "airbyte-minio-credentials" }}
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.storage.secretName | default "airbyte-minio-credentials" }}
              key: AWS_SECRET_ACCESS_KEY
        ports:
        - name: s3
          containerPort: 9000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: s3
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          {{- toYaml .Values.minio.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.containerSecurityContext" . | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      {{- with .Values.minio.persistence.storageClass }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.minio.persistence.size }}
{{- end }}
