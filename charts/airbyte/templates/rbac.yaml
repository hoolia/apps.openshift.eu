# Account of every Airbyte pod; the workload launcher starts sync pods in this namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.serviceAccountName | default "airbyte-admin" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: server
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.global.serviceAccountName | default "airbyte-admin" }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: server
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods/log
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  - pods/attach
  verbs:
  - get
  - create
- apiGroups:
  - ""
  resources:
  - pods
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.global.serviceAccountName | default "airbyte-admin" }}-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: server
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.global.serviceAccountName | default "airbyte-admin" }}-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.global.serviceAccountName | default "airbyte-admin" }}
  namespace: {{ .Release.Namespace }}
