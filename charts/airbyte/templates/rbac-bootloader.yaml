# Account of the bootloader and of the jobs that create Secrets; ordered before them
{{- $name := .Values.upstream.airbyteBootloader.serviceAccountName | default "airbyte-bootloader" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: server
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
  annotations:
    {{- include "wrapper.order" (dict "root" . "wave" "-4") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: server
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
  annotations:
    {{- include "wrapper.order" (dict "root" . "wave" "-4") | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte
    app.kubernetes.io/name: airbyte
    app.kubernetes.io/component: server
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
  annotations:
    {{- include "wrapper.order" (dict "root" . "wave" "-4") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
