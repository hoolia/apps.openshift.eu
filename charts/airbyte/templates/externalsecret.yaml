{{- if and .Values.minio.enabled (eq .Values.secrets.type "externalSecret") }}
{{- $es := .Values.secrets.externalSecret }}
{{- if not $es.storeName }}{{ fail "secrets.externalSecret.storeName is required with secrets.type=externalSecret" }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.storage.secretName | default "airbyte-minio-credentials" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: credentials
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ $es.storeName }}
  target:
    name: {{ .Values.global.storage.secretName | default "airbyte-minio-credentials" }}
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
        AWS_SECRET_ACCESS_KEY: "{{ "{{" }} .password {{ "}}" }}"
  data:
  - secretKey: password
    remoteRef:
      key: {{ $es.items.minio }}
      property: {{ $es.property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
