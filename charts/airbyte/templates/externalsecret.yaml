{{- $es := .Values.secrets.externalSecret }}
{{- $store := dict "kind" $es.storeKind "name" $es.storeName }}
{{- if eq .Values.secrets.type "externalSecret" }}
{{- if not $es.storeName }}{{ fail "secrets.externalSecret.storeName is required with secrets.type=externalSecret" }}{{ end }}
{{- if and .Values.minio.enabled $es.items.minio }}
{{- $name := .Values.global.storage.secretName | default "airbyte-minio-credentials" }}
{{- include "wrapper.externalSecret" (dict "root" . "name" $name "component" "minio" "store" $store "hook" true
  "template" (dict "AWS_ACCESS_KEY_ID" .Values.minio.rootUser "AWS_SECRET_ACCESS_KEY" "{{ .password }}")
  "data" (dict "password" (dict "key" $es.items.minio "property" "login.password"))) }}
---
{{- end }}
{{- if and .Values.database.enabled $es.items.database }}
{{- $name := .Values.global.database.secretName | default "airbyte-db-credentials" }}
{{- include "wrapper.externalSecret" (dict "root" . "name" $name "component" "database" "store" $store "hook" true
  "template" (dict "DATABASE_USER" "{{ .username }}" "DATABASE_PASSWORD" "{{ .password }}")
  "data" (dict "username" (dict "key" $es.items.database "property" "login.username") "password" (dict "key" $es.items.database "property" "login.password"))) }}
---
{{- end }}
{{- end }}
{{- range .Values.connections.externalSecrets }}
{{- if not $es.storeName }}{{ fail "connections.externalSecrets needs secrets.externalSecret.storeName" }}{{ end }}
{{- $item := .item }}
{{- $data := dict }}
{{- range $key, $property := .data }}
{{- $_ := set $data $key (dict "key" $item "property" $property) }}
{{- end }}
{{- include "wrapper.externalSecret" (dict "root" $ "name" .name "component" "connector" "store" $store "hook" false "data" $data) }}
---
{{- end }}
