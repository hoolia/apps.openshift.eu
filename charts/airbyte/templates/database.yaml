{{- if .Values.database.enabled }}
{{- $secret := .Values.global.database.secretName | default "airbyte-db-credentials" }}
{{- if not (and (eq .Values.secrets.type "externalSecret") .Values.secrets.externalSecret.items.database) }}
{{- include "wrapper.secretJob" (dict "root" . "name" $secret "component" "database" "fixed" (dict "DATABASE_USER" "airbyte") "random" "DATABASE_PASSWORD") }}
---
{{- end }}
# The bootloader migrates the database as an install hook, so the database is a hook too,
# one weight earlier; Argo CD keeps it running across syncs
apiVersion: v1
kind: Service
metadata:
  name: airbyte-db-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-db
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
    # Argo CD applies it in place on later syncs instead of replacing it
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: airbyte-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airbyte-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: airbyte-db
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.openshift.io/runtime: postgresql
    {{- include "airbyte.commonLabels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
    # Argo CD applies it in place on later syncs instead of replacing it
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: airbyte-db-svc
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airbyte-db
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airbyte-db
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.database.image.pullPolicy }}
        env:
        - name: POSTGRES_DB
          value: db-airbyte
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ $secret }}
              key: DATABASE_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $secret }}
              key: DATABASE_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d db-airbyte -h 127.0.0.1
          periodSeconds: 10
        volumeMounts:
        - name: airbyte-volume-db
          mountPath: /var/lib/postgresql/data
        resources:
          {{- toYaml .Values.database.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.containerSecurityContext" . | nindent 10 }}
  # upstream's claim name, so an upgrade from its bundled database keeps the data
  volumeClaimTemplates:
  - metadata:
      name: airbyte-volume-db
    spec:
      accessModes:
      - ReadWriteOnce
      {{- with .Values.database.persistence.storageClass }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.database.persistence.size }}
{{- end }}
