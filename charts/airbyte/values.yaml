# argocd: the database, its Secret and the bootloader account are normal objects ordered by
# Argo CD sync waves, and the bootloader runs as a Sync hook after them. helm: install hooks
# for helm install and helm upgrade; then also set upstream.airbyteBootloader.annotations: {}
installMode: argocd

# Values shared with the upstream chart (below upstream:)
global:
  # Address people open, https://<route.host>; empty: http://localhost:8080
  airbyteUrl: ""
  # Airbyte's own login (instance admin) in front of the UI and the API
  auth:
    enabled: true
  # Telemetry to Airbyte, Inc.; off
  tracking:
    enabled: false
  database:
    # Secret with DATABASE_USER and DATABASE_PASSWORD; with database.enabled an install
    # hook creates it once with a random password
    secretName: airbyte-db-credentials
    # the configuration reader uses the same user
    replica:
      userSecretKey: DATABASE_USER
      passwordSecretKey: DATABASE_PASSWORD
  storage:
    # Logs and state in the chart's own MinIO (minio.enabled)
    type: minio
    secretName: airbyte-minio-credentials
  jobs:
    # Requests and limits of every container of a sync, check or discover pod
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
    kube:
      # Labels and annotations of every sync, check or discover pod
      labels:
        sidecar.istio.io/inject: "false"
      annotations: {}

# The web UI and the API, through a Route. Airbyte's own login protects both
route:
  enabled: true
  # empty: OpenShift assigns a host under the default application domain
  host: ""
  # a sync can stream a large log; the router must not cut it short
  timeout: 300s
  # used when a host is set; certificate issued by cert-manager
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt

secrets:
  # kubernetes: Secret from the values below. externalSecret: from a secret store
  type: kubernetes
  # Secret key of the MinIO root user. Empty: an install hook generates it once inside
  # the cluster and never changes it, also under a GitOps tool
  minioRootPassword: ""
  externalSecret:
    storeKind: ClusterSecretStore
    storeName: ""
    refreshInterval: 1h
    # Vault items (login.username, login.password); an empty item: the install hook
    # generates that Secret in the cluster instead
    items:
      # password is the MinIO root password
      minio: ""
      # username and password of the database user
      database: ""

# PostgreSQL for Airbyte and Temporal at airbyte-db-svc, an install hook like upstream's
# (the bootloader needs it before the first sync), with a password generated in the cluster.
# false: set global.database.host and global.database.secretName to an external database
database:
  enabled: true
  image:
    repository: docker.io/airbyte/db
    # empty: the chart's appVersion
    tag: ""
    pullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    # empty: the cluster default
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# MinIO for logs and connector state, run by this chart (not as an install hook)
minio:
  enabled: true
  image:
    repository: docker.io/airbyte/minio
    tag: RELEASE.2023-11-20T22-40-07Z
    pullPolicy: IfNotPresent
  # root user name; the password is secrets.minioRootPassword
  rootUser: airbyte
  # bucket Airbyte writes to, as in upstream global.storage.bucket
  bucket: airbyte-bucket
  persistence:
    size: 5Gi
    # empty: the cluster default
    storageClass: ""
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      memory: 1Gi

# MCP server for the project's agents: list connections, trigger syncs, read job status.
# Its Service carries an agentgateway.dev/mcp port, so an MCP gateway that discovers
# servers by that appProtocol publishes it
mcp:
  enabled: true
  # image with Python 3; the server is files/mcp-server.py, standard library only
  image:
    repository: registry.access.redhat.com/ubi9/python-312-minimal
    tag: "9.8"
    pullPolicy: IfNotPresent
  # Not 80, 443, 8080 or 8443 (open to every project)
  port: 8000
  path: /mcp
  # Tool prefix on the gateway; empty: the release name
  targetName: ""
  # trigger and cancel syncs; false: read-only tools
  allowWrite: true
  # Namespaces (label selectors) that may call the server besides its own, e.g. the gateway's
  ingressNamespaces: []
  podLabels:
    sidecar.istio.io/inject: "false"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 512Mi

# Sources, destinations and connections, applied through the Airbyte API by a Job after
# every install and upgrade. Matched by name: a changed entry is updated, an entry
# removed here stays in Airbyte. Strings "${secret:<Secret>/<key>}" in a configuration are
# replaced by that key of a Secret of the namespace, "${secretlist:<Secret>/<key>}" by its
# comma-separated items as a list; a source or destination whose Secret or key is missing
# is skipped, and so are its connections
connections:
  enabled: false
  image:
    repository: registry.access.redhat.com/ubi9/python-312-minimal
    tag: "9.8"
    pullPolicy: IfNotPresent
  # workspace that holds the declared objects; empty: the first workspace
  workspace: ""
  # Cron schedule to apply them again, so a credential Secret added later takes effect;
  # empty: only after install and upgrade
  reconcileSchedule: ""
  # Credential Secrets of connectors from the secret store secrets.externalSecret:
  # [{name, item, data: {<secret key>: <item property>}}], for example
  # {name: google-ads, item: my-google-ads, data: {client-id: login.username}}
  externalSecrets: []
  # Connector versions, <source|destination>/<registry name>: image tag, for example
  # destination/ClickHouse: 2.1.34 (a fix newer than the platform's default). Applies to
  # the whole instance
  definitionVersions: {}
  # Declarative (low-code) connectors: [{name, manifest}] with the manifest as a YAML
  # object, or [{name, file}] for a manifest of this chart (files/declarative/<file>.yaml:
  # odoo, Odoo 19 and later through the JSON-2 API)
  declarativeSources: []
  # [{name, definition, configuration}]; definition is the connector name
  # in the registry (ClickHouse) or of a declarativeSources entry
  destinations: []
  # [{name, definition, configuration}]
  sources: []
  # [{name, source, destination, enabled, schedule, namespaceFormat, prefix, streams}];
  # schedule: a Quartz cron expression, or empty for manual syncs; streams: names to
  # sync, empty: all with the default sync mode
  connections: []
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# Feature flags of the platform, name: value. Socket-mode syncs run as user 1000, which
# restricted-v2 refuses; stdio mode runs under any user id
featureFlags:
  platform.force-run-stdio-mode: true

# Pods of the upstream chart; every container gets OpenShift's own user id
upstream:
  # helm test pod; upstream's airbyte/utils has no tag of this version
  testWebapp:
    image:
      repository: registry.access.redhat.com/ubi9/ubi-minimal
      tag: "9.8"
  serviceAccount:
    # the chart's own ServiceAccount, Role and RoleBinding; upstream renders them as
    # install hooks, which a GitOps tool replaces on every sync
    create: false
  minio:
    enabled: false
  # replaced by the chart's own database (database.enabled)
  postgresql:
    enabled: false
  server:
    extraVolumes:
    - name: feature-flags
      configMap:
        name: airbyte-feature-flags
    extraVolumeMounts:
    - name: feature-flags
      mountPath: /etc/launchdarkly
      readOnly: true
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
  worker:
    extraVolumes:
    - name: feature-flags
      configMap:
        name: airbyte-feature-flags
    extraVolumeMounts:
    - name: feature-flags
      mountPath: /etc/launchdarkly
      readOnly: true
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 2Gi
  workloadLauncher:
    extraVolumes:
    - name: feature-flags
      configMap:
        name: airbyte-feature-flags
    extraVolumeMounts:
    - name: feature-flags
      mountPath: /etc/launchdarkly
      readOnly: true
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  workloadApiServer:
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
  cron:
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
  manifestServer:
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  temporal:
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  airbyteBootloader:
    # account of templates/rbac-bootloader.yaml
    serviceAccountName: airbyte-bootloader
    # under Argo CD a Sync hook after the database (installMode argocd)
    annotations:
      argocd.argoproj.io/hook: Sync
      argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      argocd.argoproj.io/sync-wave: "-1"
    podSecurityContext:
      fsGroup: null
    containerSecurityContext:
      runAsUser: null
      runAsGroup: null
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
