apiVersion: v2
name: nextcloud
description: Nextcloud files, calendar and contacts with OnlyOffice document editing, Talk, an AI assistant, whiteboard, push and a MariaDB database with backup, and an Office documents MCP server for agents
type: application
version: 0.10.0
appVersion: "35.0.2"
home: https://apps.openshift.eu
icon: https://raw.githubusercontent.com/nextcloud/promo/master/nextcloud-icon.svg
keywords:
- files
- collaboration
- office
sources:
- https://github.com/nextcloud/helm
- https://github.com/hoolia/apps.openshift.eu
maintainers:
- name: GRN.CLOUD B.V.
  url: https://apps.openshift.eu
annotations:
  charts.openshift.io/name: Nextcloud
  charts.openshift.io/provider: GRN.CLOUD B.V.
  apps.openshift.eu/category: collaboration
  apps.openshift.eu/vendor: Nextcloud GmbH
dependencies:
- name: nextcloud
  version: 9.1.4
  repository: https://nextcloud.github.io/helm/
- name: mailu
  version: 0.1.5
  repository: https://apps.openshift.eu
  condition: mailu.enabled
- name: mcp-officeagent
  version: 0.1.1
  repository: https://apps.openshift.eu
  condition: mcp-officeagent.enabled
