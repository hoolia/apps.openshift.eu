{{- if and .Values.mailu.enabled .Values.mailRoute.enabled }}
{{- $front := printf "%s-front" (.Values.mailu.upstream.fullnameOverride | default "mailu") }}
{{- /* Mailu serves its pages under admin.uri and webmail.uri itself: no rewrite */}}
{{ include "wrapper.pathRoute" (dict "root" . "name" "mail" "partOf" "nextcloud-mail" "path" "/mail" "rewrite" "/mail" "port" "http" "service" $front) }}
{{- /* Mailu's login and the admin's assets have fixed paths on the root */}}
{{- range list "sso" "static" }}
---
{{ include "wrapper.pathRoute" (dict "root" $ "name" (printf "mail-%s" .) "partOf" "nextcloud-mail" "path" (printf "/%s" .) "rewrite" (printf "/%s" .) "port" "http" "service" $front) }}
{{- end }}
{{- end }}
