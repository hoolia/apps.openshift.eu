{{- if and .Values.mailu.enabled .Values.mailRoute.enabled }}
{{- $front := printf "%s-front" (.Values.mailu.upstream.fullnameOverride | default "mailu") }}
{{- /* Mailu front removes the /mail prefix itself (mailu.upstream.front.overrides): no rewrite */}}
{{ include "wrapper.pathRoute" (dict "root" . "name" "mail" "partOf" "nextcloud-mail" "path" "/mail" "rewrite" "/mail" "port" "http" "service" $front) }}
{{- end }}
