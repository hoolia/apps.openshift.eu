{{- if .Values.notifyPush.enabled }}
{{- $db := .Values.nextcloud.externalDatabase }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-notify-push
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"nextcloud-redis"},{"apiVersion":"apps/v1","kind":"StatefulSet","name":"nextcloud-mariadb"}]'
    app.openshift.io/vcs-uri: https://github.com/nextcloud/notify_push
  labels:
    app: nextcloud-notify-push
    app.kubernetes.io/name: nextcloud-notify-push
    app.kubernetes.io/instance: nextcloud-notify-push
    app.kubernetes.io/component: push
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: rust
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: notify-push
        image: {{ .Values.notifyPush.image }}
        imagePullPolicy: IfNotPresent
        # its own image, not the Nextcloud volume: a pod sharing that ReadWriteOnce volume
        # holds it on one node and keeps Nextcloud from starting on another
        command:
        - /notify_push
        - --port
        - "7867"
        - --metrics-port
        - "9867"
        env:
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-mariadb
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-mariadb
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-redis
              key: redis-password
        - name: DATABASE_URL
          value: mysql://$(DATABASE_USER):$(DATABASE_PASSWORD)@{{ $db.host }}/{{ $db.database }}
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@nextcloud-redis:6379
        - name: NEXTCLOUD_URL
          value: {{ include "wrapper.internalUrl" . }}
        ports:
        - name: push
          containerPort: 7867
          protocol: TCP
        - name: metrics
          containerPort: 9867
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: push
          periodSeconds: 10
          failureThreshold: 90
        livenessProbe:
          tcpSocket:
            port: push
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: push
          periodSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.notifyPush.resources | nindent 10 }}
        securityContext:
          {{- include "wrapper.restricted" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-notify-push
  labels:
    app: nextcloud-notify-push
    app.kubernetes.io/name: nextcloud-notify-push
    app.kubernetes.io/instance: nextcloud-notify-push
    app.kubernetes.io/component: push
    app.kubernetes.io/part-of: nextcloud
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: push
    port: 7867
    targetPort: push
    protocol: TCP
  - name: metrics
    port: 9867
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "wrapper.labels" "nextcloud-notify-push" | nindent 4 }}
---
{{ include "wrapper.pathRoute" (dict "root" . "name" "nextcloud-notify-push" "partOf" "nextcloud" "path" "/push" "port" "push") }}
{{- end }}
