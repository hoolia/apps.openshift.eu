{{- if and .Values.talk.enabled .Values.talk.recording.enabled }}
{{- $rec := .Values.talk.recording }}
{{- $shared := .Values.talk.shared.signaling }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-talk-recording
  labels:
    app: nextcloud-talk-recording
    app.kubernetes.io/name: nextcloud-talk-recording
    app.kubernetes.io/instance: nextcloud-talk-recording
    app.kubernetes.io/component: recording
    app.kubernetes.io/part-of: nextcloud-talk
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  {{- with $rec.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $rec.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-talk-recording
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"nextcloud-signaling"}]'
    app.openshift.io/vcs-uri: https://github.com/nextcloud/nextcloud-talk-recording
  labels:
    app: nextcloud-talk-recording
    app.kubernetes.io/name: nextcloud-talk-recording
    app.kubernetes.io/instance: nextcloud-talk-recording
    app.kubernetes.io/component: recording
    app.kubernetes.io/part-of: nextcloud-talk
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
    app.openshift.io/runtime: python
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wrapper.labels" "nextcloud-talk-recording" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wrapper.labels" "nextcloud-talk-recording" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 122
      containers:
      - name: recording
        image: {{ $rec.image }}
        imagePullPolicy: IfNotPresent
        {{- if $shared }}
        # the platform's signaling server: HPB_DOMAIN and HPB_PATH from its URL
        command:
        - /bin/sh
        - -c
        - |
          u=$(cat /run/talk-platform/signaling-url 2>/dev/null)
          r=${u#https://}
          case $u in https://?*/?*) ;; *) r=" ";; esac
          case $r in *[!A-Za-z0-9.:/_~-]*) echo "no valid signaling-url in ConfigMap nextcloud-talk-platform"; exit 1;; esac
          p=/${r#*/}
          export HPB_DOMAIN=${r%%/*} HPB_PATH=${p%/}
          exec /start.sh "$@"
        - recording
        {{- end }}
        # start.sh empties /tmp: recordings, also those kept after a failed upload, stay on the volume
        args:
        - /bin/sh
        - -c
        - |
          sed -i 's#^directory = /tmp$#directory = /recordings#' /conf/recording.conf
          grep -qx 'directory = /recordings' /conf/recording.conf || { echo "recording.conf has no directory = /tmp"; exit 1; }
          exec python -m nextcloud.talk.recording --config /conf/recording.conf
        env:
        - name: NC_DOMAIN
          value: {{ include "wrapper.host" . | quote }}
        {{- if not $shared }}
        - name: HPB_DOMAIN
          value: {{ include "wrapper.host" . | quote }}
        - name: HPB_PATH
          value: /talk/signaling
        {{- end }}
        - name: HPB_PROTOCOL
          value: https
        - name: TZ
          value: {{ $rec.timezone | quote }}
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: signaling-internal-secret
        - name: RECORDING_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-talk
              key: recording-secret
        ports:
        - name: recording
          containerPort: 1234
          protocol: TCP
        readinessProbe:
          exec:
            command: [/healthcheck.sh]
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 3
        livenessProbe:
          exec:
            command: [/healthcheck.sh]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 3
        resources:
          {{- toYaml $rec.resources | nindent 10 }}
        # the image is built for this UID
        securityContext:
          runAsUser: 122
          runAsGroup: 122
          {{- include "wrapper.restricted" . | nindent 10 }}
        volumeMounts:
        - name: recordings
          mountPath: /recordings
        {{- if $shared }}
        - name: talk-platform
          mountPath: /run/talk-platform
          readOnly: true
        {{- end }}
      volumes:
      - name: recordings
        persistentVolumeClaim:
          claimName: nextcloud-talk-recording
      {{- if $shared }}
      - name: talk-platform
        configMap:
          name: nextcloud-talk-platform
          optional: true
          items:
          - key: signaling-url
            path: signaling-url
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-talk-recording
  labels:
    app: nextcloud-talk-recording
    app.kubernetes.io/name: nextcloud-talk-recording
    app.kubernetes.io/instance: nextcloud-talk-recording
    app.kubernetes.io/component: recording
    app.kubernetes.io/part-of: nextcloud-talk
    {{- include "nextcloud.commonLabels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: recording
    port: 1234
    targetPort: recording
    protocol: TCP
  selector:
    {{- include "wrapper.labels" "nextcloud-talk-recording" | nindent 4 }}
---
{{ include "wrapper.pathRoute" (dict "root" . "name" "nextcloud-talk-recording" "partOf" "nextcloud-talk" "path" "/talk/recording" "port" "recording") }}
{{- end }}
