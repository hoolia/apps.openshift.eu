{{- if .Values.onlyoffice.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  labels:
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onlyoffice
      app.kubernetes.io/instance: onlyoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onlyoffice
        app.kubernetes.io/instance: onlyoffice
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
      - name: onlyoffice
        image: {{ .Values.onlyoffice.image }}
        imagePullPolicy: IfNotPresent
        env:
        - name: JWT_ENABLED
          value: "true"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: onlyoffice-credentials
              key: jwt-secret
        - name: PLUGINS_ENABLED
          value: "false"
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          {{- toYaml .Values.onlyoffice.resources | nindent 10 }}
        # the image runs its services as root
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  labels:
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlyoffice
  labels:
    app.kubernetes.io/name: onlyoffice
    app.kubernetes.io/instance: onlyoffice
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  tls:
  - hosts:
    - {{ include "wrapper.onlyofficeHost" . }}
    secretName: onlyoffice-tls
  rules:
  - host: {{ include "wrapper.onlyofficeHost" . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: onlyoffice
            port:
              name: http
{{- end }}
