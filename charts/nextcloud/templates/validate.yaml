{{- /* the setup script runs at Nextcloud start: the pod annotation that rolls it must follow the chart version */ -}}
{{- $v := index (.Values.nextcloud.podAnnotations | default dict) "chart-version" | toString -}}
{{- if ne $v .Chart.Version -}}
{{- fail (printf "nextcloud.podAnnotations.chart-version is %q, set it to the chart version %q" $v .Chart.Version) -}}
{{- end -}}
{{- if and .Values.mailu.enabled (not (include "wrapper.mailuActive" .)) -}}
{{- fail "mailu.enabled is true but mailu.upstream.domain is empty: give a mail domain, or set mailu.enabled false to run without mail" -}}
{{- end -}}
{{- $refused := trim (toString (.Values.mail.refusedDomainPattern | default "")) -}}
{{- if and $refused (include "wrapper.mailuActive" .) -}}
{{- $domain := trim (toString .Values.mailu.upstream.domain) -}}
{{- if regexMatch (printf "(?i)%s" $refused) $domain -}}
{{- fail (printf "mail domain %q is not allowed here: give a domain you own, or set mailu.enabled false to run without mail" $domain) -}}
{{- end -}}
{{- end -}}
{{- if and (include "wrapper.mailuActive" .) .Values.mailRoute.enabled -}}
{{- $f := index (.Values.mailu.upstream.front.podAnnotations | default dict) "chart-version" | toString -}}
{{- if ne $f .Chart.Version -}}
{{- fail (printf "mailu.upstream.front.podAnnotations.chart-version is %q, set it to the chart version %q" $f .Chart.Version) -}}
{{- end -}}
{{- end -}}
{{- $sh := .Values.talk.shared -}}
{{- range $k := list "signaling" "turn" "keepOwnServers" -}}
{{- if not (kindIs "bool" (index $sh $k)) -}}
{{- fail (printf "talk.shared.%s must be true or false" $k) -}}
{{- end -}}
{{- end -}}
{{- if and (or $sh.signaling $sh.turn) (not .Values.talk.enabled) -}}
{{- fail "talk.shared needs talk.enabled" -}}
{{- end -}}
{{- if and $sh.turn (not (regexMatch "^[A-Za-z0-9._-]+$" (toString $sh.turnGeneration))) -}}
{{- fail "talk.shared.turn needs talk.shared.turnGeneration, the turn-generation of the platform (letters, digits, . _ -)" -}}
{{- end -}}
