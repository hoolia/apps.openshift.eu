{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-credentials" (include "openoutreach.name" .) }}
{{- if eq .Values.secrets.type "kubernetes" }}
{{- $values := include "openoutreach.credentialValues" . | fromYaml }}
{{- if $values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: openoutreach
    app.kubernetes.io/name: openoutreach
    app.kubernetes.io/component: credentials
    {{- include "openoutreach.commonLabels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $values }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- else if .Values.secrets.externalSecret.items }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    app: openoutreach
    app.kubernetes.io/name: openoutreach
    app.kubernetes.io/component: credentials
    {{- include "openoutreach.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  {{- range $key, $item := $es.items }}
  - secretKey: {{ $key }}
    remoteRef:
      key: {{ kindIs "map" $item | ternary (get (default dict $item) "key") $item }}
      property: {{ kindIs "map" $item | ternary (get (default dict $item) "property" | default "login.password") "login.password" }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
  {{- end }}
{{- end }}
{{- end }}
