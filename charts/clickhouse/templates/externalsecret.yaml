{{- if eq .Values.secrets.type "externalSecret" }}
{{- $store := required "secrets.externalSecret.storeName is required" .Values.secrets.externalSecret.storeName }}
{{- range $role := list "admin" "reader" "writer" }}
{{- $name := printf "%s-%s" (include "clickhouse.fullname" $) $role }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ include "clickhouse.fullname" $ }}
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: credentials
    {{- include "clickhouse.commonLabels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.secrets.externalSecret.storeKind }}
    name: {{ $store }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- include "clickhouse.connection" (list $ $role) | nindent 8 }}
        password: "{{ "{{ .value }}" }}"
        password-sha256: "{{ "{{ .value | sha256sum }}" }}"
  data:
  - secretKey: value
    remoteRef:
      key: {{ default $name (index $.Values.secrets.externalSecret.items $role) }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- end }}
{{- end }}
