{{- if .Values.networkPolicy.enabled }}
# Callers: the own project, the listed namespaces and, with a Route, the router
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
    {{- include "clickhouse.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clickhouse.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8123
    - protocol: TCP
      port: 9000
    from:
    - podSelector: {}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- if .Values.route.enabled }}
  - ports:
    - protocol: TCP
      port: 8123
    from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
  {{- end }}
{{- end }}
