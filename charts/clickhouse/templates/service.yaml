apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickhouse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "clickhouse.fullname" . }}
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
    {{- include "clickhouse.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8123
    targetPort: http
  - name: native
    port: 9000
    targetPort: native
  selector:
    {{- include "clickhouse.selectorLabels" . | nindent 4 }}
