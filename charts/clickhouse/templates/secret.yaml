{{- if eq .Values.secrets.type "kubernetes" }}
{{- range $role := list "admin" "reader" "writer" }}
{{- $password := include "clickhouse.password" (list $ $role) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.fullname" $ }}-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ include "clickhouse.fullname" $ }}
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: credentials
    {{- include "clickhouse.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- include "clickhouse.connection" (list $ $role) | nindent 2 }}
  password: {{ $password | quote }}
  password-sha256: {{ $password | sha256sum | quote }}
{{- end }}
{{- end }}
