{{- if .Values.mcp.enabled }}
{{- $name := printf "%s-mcp" (include "clickhouse.fullname" .) }}
{{- $ns := .Release.Namespace }}
{{- $hosts := list "localhost:*" "127.0.0.1:*" }}
{{- range $h := list $name (printf "%s.%s" $name $ns) (printf "%s.%s.svc" $name $ns) (printf "%s.%s.svc.cluster.local" $name $ns) }}
{{- $hosts = concat $hosts (list $h (printf "%s:*" $h)) }}
{{- end }}
{{- $hosts = concat $hosts .Values.mcp.allowedHosts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: clickhouse-mcp
    app.kubernetes.io/component: mcp
    app.openshift.io/runtime: python
    {{- include "clickhouse.commonLabels" . | nindent 4 }}
  annotations:
    app.openshift.io/connects-to: {{ list (dict "apiVersion" "apps/v1" "kind" "StatefulSet" "name" (include "clickhouse.fullname" .)) | toJson | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "clickhouse.mcpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.mcpSelectorLabels" . | nindent 8 }}
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mcp
        image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
        imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
        env:
        - name: CLICKHOUSE_HOST
          value: {{ include "clickhouse.fullname" . }}
        - name: CLICKHOUSE_PORT
          value: "8123"
        - name: CLICKHOUSE_SECURE
          value: "false"
        - name: CLICKHOUSE_USER
          value: {{ .Values.users.reader.name | quote }}
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "clickhouse.fullname" . }}-reader
              key: password
        - name: CLICKHOUSE_ALLOW_WRITE_ACCESS
          value: "false"
        - name: CLICKHOUSE_MCP_SERVER_TRANSPORT
          value: http
        - name: CLICKHOUSE_MCP_BIND_HOST
          value: 0.0.0.0
        - name: CLICKHOUSE_MCP_BIND_PORT
          value: {{ .Values.mcp.port | quote }}
        - name: CLICKHOUSE_MCP_QUERY_TIMEOUT
          value: {{ .Values.mcp.queryTimeout | quote }}
        # callers are authenticated by the gateway in front; the user can only read
        - name: CLICKHOUSE_MCP_AUTH_DISABLED
          value: "true"
        - name: CLICKHOUSE_MCP_ALLOWED_HOSTS
          value: {{ join "," $hosts | quote }}
        # a random UID has no writable home
        - name: HOME
          value: /tmp
        {{- range $k, $v := .Values.mcp.extraEnv }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - name: mcp
          containerPort: {{ .Values.mcp.port }}
        startupProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 5
          failureThreshold: 60
        # /health answers 200 only while ClickHouse answers too
        readinessProbe:
          httpGet:
            path: /health
            port: mcp
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: mcp
          periodSeconds: 20
        resources:
          {{- toYaml .Values.mcp.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: clickhouse-mcp
    app.kubernetes.io/component: mcp
    {{- include "clickhouse.commonLabels" . | nindent 4 }}
  annotations:
    agentgateway.dev/mcp-path: {{ .Values.mcp.path | quote }}
    agentgateway.dev/mcp-target-name: {{ .Values.mcp.targetName | default .Release.Name | quote }}
spec:
  type: ClusterIP
  ports:
  - name: mcp
    port: {{ .Values.mcp.port }}
    targetPort: mcp
    protocol: TCP
    {{- with .Values.mcp.appProtocol }}
    appProtocol: {{ . }}
    {{- end }}
  selector:
    {{- include "clickhouse.mcpSelectorLabels" . | nindent 4 }}
{{- if .Values.networkPolicy.enabled }}
---
# Callers: the own project and the gateway; it reaches only DNS and its ClickHouse
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/name: clickhouse-mcp
    app.kubernetes.io/component: mcp
    {{- include "clickhouse.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clickhouse.mcpSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.mcp.port }}
    from:
    - podSelector: {}
    {{- range .Values.mcp.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "clickhouse.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 8123
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          dns.operator.openshift.io/daemonset-dns: default
    ports:
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end }}
{{- end }}
