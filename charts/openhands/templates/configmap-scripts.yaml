apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openhands.name" . }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  seed-settings.sh: |
{{ .Files.Get "files/seed-settings.sh" | indent 4 }}
  token-proxy.py: |
{{ .Files.Get "files/token-proxy.py" | indent 4 }}
