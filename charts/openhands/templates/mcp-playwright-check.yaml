{{- /* the team Playwright server (dependency mcp-playwright) must run beside the agent, under its own names */ -}}
{{- $pw := index .Values "mcp-playwright" | default dict -}}
{{- if $pw.enabled -}}
{{- if not $pw.nameSuffix -}}
{{- fail "mcp-playwright.nameSuffix must not be empty: the server would take the names of the objects of the agent" -}}
{{- end -}}
{{- $ns := .Release.Namespace -}}
{{- if $pw.team }}{{ $ns = printf "%s-%s" ($pw.tenant | default "") $pw.team }}{{ end -}}
{{- $own := include "openhands.namespace" . -}}
{{- if ne $ns $own -}}
{{- fail (printf "mcp-playwright.team and mcp-playwright.tenant must equal team and tenant: the server would run in %s, the agent runs in %s" $ns $own) -}}
{{- end -}}
{{- end -}}
{{- with .Values.gateway.mcpUpstream -}}
{{- if not $.Values.gateway.upstream -}}
{{- fail "gateway.mcpUpstream needs gateway.upstream: without it no token proxy runs" -}}
{{- end -}}
{{- if not (has (urlParse .).path (list "" "/")) -}}
{{- fail (printf "gateway.mcpUpstream %s: give the gateway without a path; /mcp is added per server" .) -}}
{{- end -}}
{{- end -}}
