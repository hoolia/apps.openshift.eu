{{- if eq .Values.login.provider "openshift" }}
{{- $name := include "tenant.login" . }}
{{- $es := .Values.secrets.externalSecret }}
{{- if and (eq .Values.secrets.type "externalSecret") $es.items.cookieSecret }}
# Login cookie key from the secret store; the value must be 16, 24 or 32 characters
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-cookie-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $es.storeName }}
  target:
    name: {{ $name }}-cookie-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: cookie-secret
    remoteRef:
      key: {{ $es.items.cookieSecret }}
      property: login.password
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
{{- $found := lookup "v1" "Secret" .Release.Namespace (printf "%s-cookie-secret" $name) }}
{{- $existing := ternary (default dict $found.data) dict (not (empty $found)) }}
{{- /* oauth-proxy accepts 16, 24 or 32 bytes: a value of another length is hashed to 32 */}}
{{- $cookie := .Values.secrets.cookieSecret }}
{{- if and $cookie (not (has (len $cookie) (list 16 24 32))) }}
{{- $cookie = $cookie | sha256sum | trunc 32 }}
{{- end }}
# Login cookie key, generated once and kept on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cookie-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  cookie-secret: {{ include "tenant.secretValue" (dict "value" $cookie "existing" $existing "key" "cookie-secret" "length" 32) | b64enc | quote }}
{{- end }}
{{- end }}
