{{- $root := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guacamole.fullname" . }}-init
  labels:
    app: {{ printf "%s-init" (include "guacamole.fullname" $) | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: database
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
data:
  init.sh: |
    set -eu
    until pg_isready -q; do
      echo "waiting for the database"
      sleep 5
    done
    # the schema is created once; Guacamole never creates its own tables
    if [ "$(psql -tAc "SELECT to_regclass('public.guacamole_user') IS NULL")" = t ]; then
      echo "creating the schema"
      psql -v ON_ERROR_STOP=1 --single-transaction -q -f /work/schema.sql
    fi
    psql -v ON_ERROR_STOP=1 --single-transaction -q -f /scripts/init.sql
    echo "done"
  # applied on every install and upgrade: each statement leaves the same state
  init.sql: |
    \set admin_password `cat /secrets/adminPassword`
    {{- range $i, $c := .Values.connections }}
    {{- range $j, $p := keys ($c.secretParameters | default dict) | sortAlpha }}
    \set secret_{{ $i }}_{{ $j }} `cat /secrets/{{ index $c.secretParameters $p }}`
    {{- end }}
    {{- end }}

    -- guacadmin: password from the Secret, hashed as Guacamole does
    UPDATE guacamole_user
    SET password_hash = sha256(convert_to(:'admin_password' || coalesce(upper(encode(password_salt, 'hex')), ''), 'UTF8')),
        password_date = now()
    WHERE entity_id = (SELECT entity_id FROM guacamole_entity WHERE name = 'guacadmin' AND type = 'USER')
      AND password_hash <> sha256(convert_to(:'admin_password' || coalesce(upper(encode(password_salt, 'hex')), ''), 'UTF8'));
    {{- range $i, $c := .Values.connections }}
    {{- $name := include "guacamole.sql" (required "connections[].name is required" $c.name) }}
    {{- $conn := printf "(SELECT connection_id FROM guacamole_connection WHERE connection_name = %s AND parent_id IS NULL)" $name }}
    {{- $params := dict "hostname" (required "connections[].hostname is required" $c.hostname) }}
    {{- if $c.port }}{{- $_ := set $params "port" $c.port }}{{- end }}
    {{- if $root.Values.recording.enabled }}
    {{- $_ := set $params "recording-path" "${HISTORY_PATH}/${HISTORY_UUID}" }}
    {{- $_ := set $params "create-recording-path" "true" }}
    {{- end }}
    {{- range $k, $v := ($c.parameters | default dict) }}{{- $_ := set $params $k $v }}{{- end }}
    {{- $secretNames := keys ($c.secretParameters | default dict) | sortAlpha }}
    {{- $all := concat (keys $params) $secretNames | uniq | sortAlpha }}

    -- connection {{ $c.name }}
    INSERT INTO guacamole_connection (connection_name, protocol)
    SELECT {{ $name }}, {{ include "guacamole.sql" (required "connections[].protocol is required" $c.protocol) }}
    WHERE NOT EXISTS {{ $conn }};
    UPDATE guacamole_connection SET protocol = {{ include "guacamole.sql" $c.protocol }}
    WHERE connection_name = {{ $name }} AND parent_id IS NULL;
    DELETE FROM guacamole_connection_parameter
    WHERE connection_id = {{ $conn }}
      AND parameter_name NOT IN ({{ range $n, $k := $all }}{{ if $n }}, {{ end }}{{ include "guacamole.sql" $k }}{{ end }});
    INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
    SELECT {{ $conn }}, v.name, v.value FROM (VALUES
    {{- range $k := keys $params | sortAlpha }}
    {{- if not (has $k $secretNames) }}
      ({{ include "guacamole.sql" $k }}, {{ include "guacamole.sql" (index $params $k) }}),
    {{- end }}
    {{- end }}
    {{- range $j, $k := $secretNames }}
      ({{ include "guacamole.sql" $k }}, :'secret_{{ $i }}_{{ $j }}'),
    {{- end }}
      (NULL, NULL)
    ) AS v(name, value)
    WHERE v.name IS NOT NULL
    ON CONFLICT (connection_id, parameter_name) DO UPDATE SET parameter_value = EXCLUDED.parameter_value;
    {{- $users := list }}
    {{- range $u := ($c.users | default list) }}{{- $users = append $users (include "guacamole.sql" $u) }}{{- end }}
    {{- range $u := $users }}
    INSERT INTO guacamole_entity (name, type) VALUES ({{ $u }}, 'USER')
    ON CONFLICT (type, name) DO NOTHING;
    -- a random password nobody knows: the user signs in through single sign-on
    INSERT INTO guacamole_user (entity_id, password_hash, password_salt, password_date)
    SELECT entity_id,
           sha256(convert_to(gen_random_uuid()::text || gen_random_uuid()::text, 'UTF8')),
           sha256(convert_to(gen_random_uuid()::text, 'UTF8')),
           now()
    FROM guacamole_entity WHERE name = {{ $u }} AND type = 'USER'
    ON CONFLICT (entity_id) DO NOTHING;
    INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
    SELECT entity_id, {{ $conn }}, 'READ'
    FROM guacamole_entity WHERE name = {{ $u }} AND type = 'USER'
    ON CONFLICT DO NOTHING;
    -- READ on the connection and nothing else
    DELETE FROM guacamole_connection_permission
    WHERE entity_id = (SELECT entity_id FROM guacamole_entity WHERE name = {{ $u }} AND type = 'USER')
      AND permission <> 'READ';
    DELETE FROM guacamole_system_permission
    WHERE entity_id = (SELECT entity_id FROM guacamole_entity WHERE name = {{ $u }} AND type = 'USER');
    {{- end }}
    -- users removed from the list lose the connection
    DELETE FROM guacamole_connection_permission
    WHERE connection_id = {{ $conn }}
      AND entity_id NOT IN (SELECT entity_id FROM guacamole_entity WHERE type = 'USER' AND name IN ({{ if $users }}{{ join ", " $users }}{{ else }}NULL{{ end }}));
    {{- end }}
