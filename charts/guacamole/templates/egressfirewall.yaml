{{- $fw := .Values.kiosk.egressFirewall }}
{{- if and .Values.kiosk.enabled $fw.enabled }}
# applies to every pod of the project, Guacamole included: the OpenID Connect
# issuer must be in the list. OVN-Kubernetes allows one, named default
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  labels:
    app: {{ include "guacamole.kiosk" $ | quote }}
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/component: network
    {{- include "guacamole.commonLabels" $ | nindent 4 }}
spec:
  egress:
  {{- range $fw.allowedDnsNames }}
  - type: Allow
    to:
      dnsName: {{ . }}
  {{- end }}
  {{- range $fw.allowedCidrs }}
  - type: Allow
    to:
      cidrSelector: {{ . }}
  {{- end }}
  - type: Deny
    to:
      cidrSelector: 0.0.0.0/0
{{- end }}
