# Team of the tenant the server serves: the chart puts every object into <tenant>-<team>, a
# namespace the team already has. Empty: the release namespace
team: ""
# Tenant the server belongs to; required with team
tenant: ""

# switch of this server when a bundle chart includes it
enabled: true

# name of the server's objects and of the server on an MCP gateway (tools <name>_*).
# Empty: mcp.server
nameOverride: ""

# OfficeAgent.NET MCP server image, published by the upstream project
image:
  repository: ghcr.io/ilia-sokolov/officeagent-mcp
  tag: 1.2.0@sha256:fea62b6608902a0b1cd4cb75fa538a47ccfb7489036dd124e2c89380b5bde134
  pullPolicy: IfNotPresent

officeagent:
  # in-memory connection "session": import_document_content puts a document in,
  # export_document_content takes the result out; documents last as long as the pod
  session:
    enabled: true
    # total bytes the session connection holds at once
    maximumTotalBytes: 104857600
  # create_document, the template tools and merge_documents
  allowCreation: true
  # register_document, open_document, edit_document and the other tools that address a file
  # of the documents connection by its path
  allowRegistration: true
  # create_document_content, inspect_document_content and edit_document_content, which carry
  # the whole document as base64 in every call
  allowInlineContent: false
  # refuse a plan without the snapshot eTag of its inspect, so a retry cannot apply twice
  requirePlanSnapshot: false
  # list every tool parameter as required (OpenAI strict function calling)
  strictToolSchemas: true
  # calculate workbook formulas on save
  calculateFormulas: false

# filesystem connection: a folder the server keeps documents in across restarts
documents:
  enabled: true
  # connection id agents address these documents under
  connectionId: documents
  allowedExtensions:
  - .docx
  - .pptx
  - .xlsx
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .svg
  # Tracked or Direct, for an operation without a mode; a deck refuses Tracked, so Direct
  # serves both and a Word edit asks for Tracked itself
  defaultChangeMode: Direct
  # size cap per document
  maximumBytes: 104857600
  persistence:
    # false: an emptyDir, documents last as long as the pod
    enabled: true
    # existing claim to use instead of the chart's own
    existingClaim: ""
    size: 1Gi
    # empty: the cluster's default StorageClass
    storageClass: ""
    accessMode: ReadWriteOnce
    # extra annotations on the chart's claim, for example to keep it when a GitOps tool
    # deletes the release
    annotations: {}

# container port of the server; not 80, 443, 8080 or 8443 (open to every project)
port: 13080

# user ID of the server; empty lets OpenShift assign one. On Kubernetes without such an
# assignment set the image's app user 1654
runAsUser: null

mcp:
  # Service port appProtocol an MCP gateway discovers; empty leaves it unset
  appProtocol: agentgateway.dev/mcp
  # prefix of the catalog labels
  labelDomain: mcp.openshift.eu
  # <labelDomain>/server
  server: officeagent
  # <labelDomain>/bundle
  bundle: officeagent
  # <labelDomain>/category
  category: documents

service:
  # extra labels on the Service, for example the gateway's exposure label
  labels: {}
  annotations: {}

# requests and limits of the server
resources:
  requests:
    cpu: 20m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Token check in front of the server (an Envoy sidecar): every request but /healthz needs a
# bearer JWT that the issuer signed; the Service port then reaches the sidecar and the
# server listens on localhost only. Off: the server asks callers for no credential, so only
# a gateway that authenticates callers may reach it
auth:
  enabled: false
  # OpenID Connect issuer of the tokens (the iss claim). Empty with auth.enabled: every
  # request but /healthz is refused
  issuerUrl: ""
  # signing keys of the issuer; empty: <issuerUrl>/protocol/openid-connect/certs (Keycloak)
  jwksUri: ""
  # a token's aud claim must name one of these; empty: any audience. Each entry is a
  # template, for example "{{ .Release.Namespace }}"
  audiences: []
  # a token's groups claim must name one of these; empty: any group
  allowedGroups: []
  # claim that carries the groups of the caller
  groupsClaim: groups
  # localhost port of the server behind the sidecar
  upstreamPort: 13081
  # longest silence on an open response stream
  streamIdleTimeout: 3600s
  # trust store of the sidecar for the JWKS address
  caFile: /etc/ssl/certs/ca-certificates.crt
  # trace, debug, info, warning, error, critical or off
  logLevel: warning
  # Envoy proxy image, published by the Envoy project
  image:
    repository: docker.io/envoyproxy/envoy
    tag: distroless-v1.39.3@sha256:7369b033550a14997e5d698677b7b51f0210a80754f5d084c5caa1a78268267b
    pullPolicy: IfNotPresent
  # requests and limits of the sidecar
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

networkPolicy:
  enabled: true
  # Namespaces (label selectors) that may call the server besides its own, e.g. the gateway's
  ingressNamespaces: []
  egress:
    # The server calls nothing outside its pod: egress to DNS only
    enabled: true
    dnsNamespace: openshift-dns
    dnsPort: 5353
