{{- if and .Values.enabled .Values.auth.enabled }}
{{- $auth := .Values.auth }}
{{- $issuer := trimSuffix "/" $auth.issuerUrl }}
{{- $jwks := include "mcp-officeagent.jwksUri" . }}
{{- $u := urlParse $jwks }}
{{- $jwksHost := first (splitList ":" $u.host) }}
{{- $jwksPort := include "mcp-officeagent.jwksPort" . }}
# Token check in front of the server: every request but /healthz needs a valid JWT of
# auth.issuerUrl; without auth.issuerUrl every request but /healthz is refused
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-officeagent.name" . }}-auth
  namespace: {{ include "mcp-officeagent.namespace" . }}
  labels:
    app: {{ include "mcp-officeagent.name" . }}
    app.kubernetes.io/name: mcp-officeagent
    app.kubernetes.io/component: server
    {{- include "mcp-officeagent.commonLabels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: mcp
        address:
          socket_address:
            address: 0.0.0.0
            port_value: {{ .Values.port }}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: mcp
              # streamable HTTP keeps a response stream open between events
              stream_idle_timeout: {{ $auth.streamIdleTimeout }}
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              route_config:
                virtual_hosts:
                - name: mcp
                  domains:
                  - "*"
                  routes:
                  {{- if not $issuer }}
                  # no issuer configured: every request but /healthz is refused
                  - match:
                      path: /healthz
                    route:
                      cluster: server
                  - match:
                      prefix: /
                    direct_response:
                      status: 401
                      body:
                        inline_string: "auth.issuerUrl is not set\n"
                  {{- else }}
                  - match:
                      prefix: /
                    route:
                      cluster: server
                      timeout: 0s
                  {{- end }}
              http_filters:
              {{- if $issuer }}
              - name: envoy.filters.http.jwt_authn
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                  providers:
                    issuer:
                      issuer: {{ $issuer | quote }}
                      {{- with $auth.audiences }}
                      audiences:
                      {{- range . }}
                      - {{ . | quote }}
                      {{- end }}
                      {{- end }}
                      remote_jwks:
                        http_uri:
                          uri: {{ $jwks | quote }}
                          cluster: jwks
                          timeout: 5s
                        cache_duration: 600s
                        async_fetch:
                          fast_listener: false
                        retry_policy:
                          num_retries: 3
                      payload_in_metadata: jwt_payload
                  rules:
                  - match:
                      path: /healthz
                  - match:
                      prefix: /
                    requires:
                      provider_name: issuer
              {{- with $auth.allowedGroups }}
              - name: envoy.filters.http.rbac
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                  rules:
                    action: ALLOW
                    policies:
                      health:
                        permissions:
                        - url_path:
                            path:
                              exact: /healthz
                        principals:
                        - any: true
                      groups:
                        permissions:
                        - any: true
                        principals:
                        {{- range . }}
                        - sourced_metadata:
                            metadata_matcher:
                              filter: envoy.filters.http.jwt_authn
                              path:
                              - key: jwt_payload
                              - key: {{ $auth.groupsClaim }}
                              value:
                                list_match:
                                  one_of:
                                    string_match:
                                      exact: {{ . | quote }}
                        {{- end }}
              {{- end }}
              {{- end }}
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: server
        type: STATIC
        connect_timeout: 5s
        load_assignment:
          cluster_name: server
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: {{ $auth.upstreamPort }}
      {{- if $issuer }}
      - name: jwks
        type: STRICT_DNS
        dns_lookup_family: V4_PREFERRED
        connect_timeout: 5s
        load_assignment:
          cluster_name: jwks
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ $jwksHost }}
                    port_value: {{ $jwksPort }}
        {{- if eq $u.scheme "https" }}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: {{ $jwksHost }}
            common_tls_context:
              validation_context:
                trusted_ca:
                  filename: {{ $auth.caFile }}
                match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: {{ $jwksHost }}
        {{- end }}
      {{- end }}
{{- end }}
