{{- if and .Values.enabled .Values.auth.enabled (not .Values.auth.existingSecret) }}
# Cookie and client secret of the token check, generated once and kept on upgrade
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-auth.secretName" (dict "root" . "name" (include "mcp-officeagent.name" .)) }}
  namespace: {{ include "mcp-officeagent.namespace" . }}
  labels:
    app: {{ include "mcp-officeagent.name" . }}
    app.kubernetes.io/name: mcp-officeagent
    app.kubernetes.io/component: credentials
    {{- include "mcp-officeagent.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- $auth := deepCopy .Values.auth }}
  {{- /* oauth2-proxy takes a 16, 24 or 32 byte cookie secret: hash any other length */}}
  {{- if and $auth.cookieSecret (not (has (len $auth.cookieSecret) (list 16 24 32))) }}
  {{- $_ := set $auth "cookieSecret" (sha256sum $auth.cookieSecret | trunc 32) }}
  {{- end }}
  {{- include "mcp-auth.secretData" (dict "root" (dict "Values" (dict "auth" $auth)) "name" (include "mcp-officeagent.name" .) "namespace" (include "mcp-officeagent.namespace" .)) | nindent 2 }}
{{- end }}
