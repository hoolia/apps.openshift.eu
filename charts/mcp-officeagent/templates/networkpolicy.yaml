{{- if and .Values.enabled .Values.networkPolicy.enabled }}
# Callers: the own project and the listed namespaces (an MCP gateway); the server asks
# callers for no credential and reaches nothing outside its pod
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-officeagent.name" . }}
  namespace: {{ include "mcp-officeagent.namespace" . }}
  labels:
    {{- include "mcp-officeagent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-officeagent.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egress.enabled }}
  - Egress
  {{- end }}
  ingress:
  - ports:
    - protocol: TCP
      port: {{ .Values.port }}
    from:
    - podSelector: {}
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - namespaceSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  {{- if .enabled }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .dnsNamespace }}
    ports:
    - protocol: UDP
      port: {{ .dnsPort }}
    - protocol: TCP
      port: {{ .dnsPort }}
  {{- end }}
  {{- end }}
{{- end }}
