{{- $s := .Values.secrets }}
{{- if and (include "mcp-hosted.ready" .) (not $s.existingSecret) }}
{{- $secret := include "mcp-hosted.secret" . }}
{{- if eq $s.type "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-hosted.namespace" . }}
  labels:
    {{- include "mcp-hosted.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  refreshInterval: {{ $s.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.externalSecret.storeKind }}
    name: {{ required "secrets.externalSecret.storeName is required" $s.externalSecret.storeName }}
  # ESO defaults, spelled out so a GitOps tool sees no drift
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: api-key
    remoteRef:
      key: {{ default (printf "%s-%s" .Release.Name (include "mcp-hosted.name" .)) $s.externalSecret.item }}
      property: {{ $s.externalSecret.property }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      nullBytePolicy: Ignore
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ include "mcp-hosted.namespace" . }}
  labels:
    {{- include "mcp-hosted.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
data:
  api-key: {{ $s.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
