name: coding-agent
version: 1.0.0
description: Skills and MCP servers built into the coding-agent images
dependencies:
  apm:
  - /opt/apm/skills/openshift-cli
  - /opt/apm/skills/gitlab-cli
  - /opt/apm/skills/helm-kustomize
  - /opt/apm/skills/exact-invoice-matching
  - /opt/apm/skills/exact-purchase-invoice-upload
  - /opt/apm/skills/nl-conventions
  - /opt/apm/skills/afletteren
  - /opt/apm/skills/afschrijving
  - /opt/apm/skills/loonjournaalpost
  - /opt/apm/skills/maandafsluiting
  - /opt/apm/skills/import-transactions
  - /opt/apm/skills/smart-categorize
  - /opt/apm/skills/month-end-close
  - /opt/apm/skills/monthly-digest
  - /opt/apm/skills/expense-optimizer
  - /opt/apm/skills/profit-loss
  - /opt/apm/skills/cash-flow-forecast
  - /opt/apm/skills/runway-calculator
  - /opt/apm/skills/revenue-concentration
  - /opt/apm/mcp/kubernetes
